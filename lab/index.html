<script>/* lab start-up probe: shows any error on screen, and says so if the app hasn't drawn after 10 s */
(function(){ var E=[], box=null;
  function show(t){ try{ if(!box){ box=document.createElement("pre"); box.id="labErr";
      box.style.cssText="position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 8px);z-index:99999;margin:0;padding:12px;max-height:60vh;overflow:auto;white-space:pre-wrap;font:12px/1.4 ui-monospace,monospace;background:#7f1d1d;color:#fff;border-radius:12px;-webkit-user-select:text;user-select:text";
      (document.body||document.documentElement).appendChild(box) }
    box.textContent="Lab problem (screenshot this):\n"+t+"\n\n"+navigator.userAgent }catch(e){} }
  addEventListener("error",function(e){ if(e.target && e.target!==window && !e.message) return;   /* a picture or file that failed to load is not an app error (build 96) */
    E.push((e.message||"error")+" @ "+String(e.filename||"").split("/").pop()+":"+e.lineno+":"+e.colno); show(E.join("\n")) },true);
  addEventListener("unhandledrejection",function(e){ var r=e.reason; E.push("Promise: "+(r&&(r.stack||r.message)||r)); show(E.join("\n")) });
  setTimeout(function(){ var v=document.getElementById("view"); if(!v||!v.children.length) show((E.join("\n")||"No error caught.")+"\nThe app did not finish starting.") },10000);
})();</script>

<title>Pay Tracker LAB</title>
<style>
/* Layout: flight-strip header with month selector, five tabs, one working panel each. Theme follows the 737 question bank: parchment, navy, oxblood. Single light look by design. */
:root{
  --bg:#ddd8cc; --surface:#f5f0e6; --surface2:#ede8dc; --border:#c4b99a;
  --accent:#1a3a6b; --accent2:#9e2a1c; --green:#2d6a30; --red:#9e2a1c; --yellow:#8b6914; --orange:#a05828;
  --text:#1c1814; --muted:#7a6f60; --onfill:#fffaf0;
  --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:max(16px,env(safe-area-inset-left));padding-block:max(16px,env(safe-area-inset-top)) max(40px,env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.num,td.n,input.n,.v,.pay,.kpi b{font-variant-numeric:tabular-nums}
h1,h2,h3{font-weight:800;margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header strip */
.strip{display:grid;grid-template-columns:auto 1fr auto;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);overflow:hidden}
.strip .cs{background:var(--accent);color:var(--onfill);padding:12px 16px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.strip .cs b{font-size:20px;font-weight:800;line-height:1.1}
.strip .cs span{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;opacity:.8;margin-top:4px}
.strip .mid{display:flex;align-items:center;gap:8px;padding:8px 14px;min-width:0;flex-wrap:wrap}
.mid .mlabel{font-size:20px;font-weight:800;min-width:8.5em;text-align:center}
.iconbtn{border:1px solid var(--border);background:var(--surface2);border-radius:6px;width:34px;height:34px;cursor:pointer;font-size:16px;font-weight:700}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn:active,.btn:active{transform:scale(.97)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--border);color:var(--muted);background:var(--surface2);white-space:nowrap}
.chip.rev{border-color:var(--accent);color:var(--accent);background:rgba(26,58,107,.08)}
.chip.ex{border-color:var(--orange);color:var(--orange);background:rgba(160,88,40,.08)}
.strip .kpis{display:flex;background:var(--surface2);border-left:1px solid var(--border)}
.kpi{padding:8px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:1px solid var(--border)}
.kpi:first-child{border-left:0}
.kpi small{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.kpi b{font-size:18px;font-weight:800;white-space:nowrap}
@media (max-width:820px){
  .strip{grid-template-columns:1fr}
  .strip .kpis{border-left:0;border-top:1px solid var(--border)}
  .strip .mid{justify-content:space-between;border-top:1px solid var(--border)}
  .kpi{flex:1;min-width:0;padding:8px}
  .kpi b{font-size:15px}
}

/* Tabs */
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
nav.tabs button{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--onfill)}

.panel{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.card .sub{color:var(--muted);font-size:13px;margin:-4px 0 0;max-width:75ch}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.row > *{flex:1 1 300px;min-width:0}
.note{font-size:12px;color:var(--muted);max-width:75ch;margin:0}
.banner{border:1px solid rgba(160,88,40,.35);background:rgba(160,88,40,.1);color:var(--text);border-radius:8px;padding:10px 14px;font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.banner.info{border-color:var(--border);background:var(--surface2)}

/* Tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:6px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:4px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
td.n,th.n{text-align:right}
tfoot td{font-weight:800;border-bottom:0;border-top:2px solid var(--text)}
.in{border:1px solid var(--border);background:var(--surface2);border-radius:6px;padding:6px 7px;width:100%;min-width:0;font-size:14px}
.in:focus{border-color:var(--accent);background:var(--surface);outline:none}
.in.n{text-align:right;font-variant-numeric:tabular-nums}
.in.caps{text-transform:uppercase}
td .del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:17px;padding:2px 6px}
td .del:hover{color:var(--red)}
.dl{display:none;font-size:12px;font-weight:600}
@media (max-width:700px){.dl{display:inline}}
.pay{text-align:right;white-space:nowrap;font-weight:600}
.short{color:var(--orange);font-size:11px;font-weight:600;display:block}
.btn{border:1px solid var(--accent2);background:var(--accent2);color:var(--onfill);border-radius:var(--radius);padding:9px 16px;cursor:pointer;font-size:13px;font-weight:700}
.btn.ghost{background:rgba(26,58,107,.08);border-color:var(--accent);color:var(--accent)}
.btn.quiet{border-color:var(--border);background:var(--surface2);color:var(--text)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.sbypick{margin-top:12px;align-items:flex-end;justify-content:space-between}.sbypick .muted{flex:1 1 200px;font-size:13px}.sbypick .f{flex:0 1 260px}
.empty{border:1px dashed var(--border);background:var(--surface2);border-radius:var(--radius);padding:20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center;font-size:13px}
.empty b{color:var(--text)}

.sec td:nth-child(1){width:150px}
.sec td:nth-child(3),.sec td:nth-child(4){width:80px}
.sec td:nth-child(5){width:170px}
.sec td:nth-child(6){width:96px}
td.act{white-space:nowrap;text-align:right;width:1%}
td.act .chip{margin-right:4px}
.chip.warn{color:var(--yellow);border-color:var(--yellow)}
/* The block time you are paid on */
.in.paid{background:rgba(45,106,48,.14);border-color:rgba(45,106,48,.6);color:var(--green);font-weight:700}
.in.paid:focus{background:rgba(45,106,48,.08)}
.fbv{display:block;min-height:34px;line-height:20px}
@media (max-width:700px){ table.stack tr.halt-row td{text-align:left;grid-column:auto} }
.fbtick{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;justify-content:flex-end}
.fbtick input{margin:0}
.fbprev{border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;background:var(--surface2);margin-top:10px}
input[type=date].in{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;width:100%;text-align:left;min-height:34px}
input[type=date].in::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date].in::-webkit-datetime-edit{padding:0}
@media (max-width:700px){
  table.stack thead{display:none}
  table.stack, table.stack tbody, table.stack tr, table.stack td{display:block;width:auto!important}
  table.stack tr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:10px 0;border-bottom:1px solid var(--border)}
  table.stack td{border:0;padding:0}
  table.stack td[data-l]::before{content:attr(data-l);display:block;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  table.stack td.w2,table.stack td.pc{grid-column:span 2}
  table.stack td.pc,table.stack td.dom-amt{text-align:left}
  table.stack td:last-child{grid-column:span 2;text-align:right;align-self:end}
  table.stack tfoot{display:block}
  table.stack tfoot tr{grid-template-columns:1fr auto}
  table.stack tfoot td:last-child{display:none}
  table.stack td.act{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:4px;white-space:normal}
  table.stack td.act .chip{margin-right:0}
  table.stack .rtime,table.stack td.pay{white-space:normal;overflow-wrap:anywhere}
}

/* Payslip */
.slip{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.slip > div{padding:14px 16px;min-width:0}
.slip > div + div{border-left:1px solid var(--border)}
.slip h3{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.line{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--surface2);font-size:14px}
.line span:first-child{min-width:0}
.line .sm{display:block;font-size:11.5px;color:var(--muted)}
.line .v{white-space:nowrap;font-weight:600}
.line.tot{border-bottom:0;border-top:2px solid var(--text);margin-top:6px;padding-top:8px;font-weight:800}
.netbar{grid-column:1/-1;border-left:0!important;border-top:1px solid var(--border);background:var(--surface2);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.netbar span{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.netbar b{font-size:30px;font-weight:800;color:var(--green)}
.netbar .extra{flex-basis:100%;font-size:12.5px;letter-spacing:0;text-transform:none;font-weight:500}
@media (max-width:700px){.slip{grid-template-columns:1fr}.slip > div + div{border-left:0;border-top:1px solid var(--border)}}

.cmp{display:grid;grid-template-columns:auto 1fr 1fr 1fr}
.cmp > div{padding:7px 10px;border-bottom:1px solid var(--border);font-size:14px}
.cmp .h{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.cmp .v{text-align:right;white-space:nowrap}
.up{color:var(--green);font-weight:700} .down{color:var(--red);font-weight:700}
.verdict{border-radius:8px;padding:10px 12px;font-size:13.5px;font-weight:600;border:1px solid}
.verdict.ok{color:var(--green);border-color:rgba(45,106,48,.35);background:rgba(45,106,48,.08)}
.verdict.bad{color:var(--red);border-color:rgba(158,42,28,.35);background:rgba(158,42,28,.08)}
.verdict.warn{color:var(--orange);border-color:rgba(160,88,40,.4);background:rgba(160,88,40,.08)}
.verdict+.verdict{margin-top:-4px}
.verdict.info{color:var(--accent);border-color:rgba(26,58,107,.3);background:rgba(26,58,107,.06)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
label.f .in,label.f select{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px;color:var(--text);font-size:14px;font-weight:400;letter-spacing:0;text-transform:none}
.fx th:not(:first-child),.fx td:not(:first-child){text-align:right}
.fx td:first-child{font-size:14px}
.fx td:last-child{width:1%}
.fx .in{width:122px;max-width:122px;margin-left:auto;display:block}

.chart svg{width:100%;height:auto;display:block}
.chart text{font-size:10px;font-weight:600;fill:var(--muted);font-family:var(--f-body)}
.bar{fill:var(--accent)}
.bar.rec{fill:var(--accent);opacity:.55}
/* Year table: one text size, one row height, month column pinned while the figures scroll */
.chart .xlab{display:grid;grid-template-columns:repeat(12,1fr);margin-top:6px}
.chart .xlab span{text-align:center;font-size:11px;font-weight:600;color:var(--muted)}
.yr table{font-size:13.5px}
.yr th,.yr td{white-space:nowrap;padding:9px 10px;height:40px}
.yr th{height:auto}
.yr td.n{font-weight:500}
.yr th:first-child,.yr td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;padding-left:2px}
.yr td.none{color:var(--muted);font-weight:400}
.yr tfoot td{font-weight:800}
.mlink{border:0;background:none;padding:0;font:inherit;font-size:13.5px;font-weight:700;color:var(--accent);cursor:pointer;min-width:2.6em;text-align:left}
.mlink:hover{text-decoration:underline}
.rtime{display:block;font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap}
textarea.in{resize:vertical;width:100%}
.fleet{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.fleet label.f{flex:0 0 190px}
.fleet-out{display:flex;flex-direction:column;padding-bottom:6px}
.fleet-out b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.fleet-out span{font-size:11px;color:var(--muted)}
.fleet .chip{margin-bottom:9px}
/* Duty tab */
.daynav{gap:10px}
.dn-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dn-mid{display:flex;flex-direction:column;align-items:center}
.dn-mid b{font-size:19px;font-weight:800}
.dn-mid span{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase}
table.chk .rtime,table.tl .rtime{white-space:normal}
@media (max-width:380px){input.in.actin{width:60px;padding:5px 4px}table.chk th,table.chk td,table.tl th,table.tl td{padding-left:5px;padding-right:5px}table.chk th{font-size:10px;letter-spacing:.3px}table.chk .rtime{overflow-wrap:anywhere}}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent);text-decoration:underline;cursor:pointer}
.flags{display:flex;flex-direction:column;gap:8px;margin-top:6px;padding-top:10px;border-top:1px solid var(--border)}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}label.chk input{width:18px;height:18px;accent-color:var(--accent)}
.exrow td{vertical-align:top}
.exname{display:flex;flex-direction:column;gap:6px}.exname .in{width:100%;max-width:none;margin:0}.examt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.nextp{border:1px solid var(--border);background:var(--surface2);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.nextp h3{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:0}
.nextp .sub{margin:0;font-size:12.5px}
.nextg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.nextg>div{display:flex;flex-direction:column;gap:1px}.nextg span{font-size:11px;color:var(--muted);font-weight:600}.nextg b{font-size:22px;font-weight:800;line-height:1.15}.nextg small{font-size:12px;color:var(--muted)}.nextg em{font-style:normal;font-size:12px;color:var(--text)}
.refbtn{background:none;border:0;padding:0 2px;margin-left:4px;font-size:13px;line-height:1;cursor:pointer;vertical-align:middle}
.refx{display:none!important}.refx.ref-open{display:block!important}
.nextp h3{display:flex;align-items:center;gap:4px}
.tpair{display:flex;gap:6px;margin-top:6px}.tpair .in{color:var(--text);font-weight:400;letter-spacing:0;text-transform:none}.tpair label{display:flex;flex-direction:column;justify-content:flex-end;white-space:nowrap;gap:2px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);flex:1 1 0;min-width:0}
.phist td:first-child{white-space:nowrap;width:1%;color:var(--muted);font-size:13px}.phist td{font-size:13px}
.rmrow{justify-content:flex-end}.btn.rm{color:var(--red);border-color:var(--border);font-size:12px;padding:7px 12px}
.gone{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}.gone li{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.wkline{display:flex;flex-direction:column;gap:2px;border:1px solid var(--border);background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:14px}
.wkline>b{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.dstrip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;padding:2px 18px 8px;margin:0 -18px;scroll-padding:0 18px;scrollbar-width:none;align-items:stretch}
.ds{flex:0 0 58px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;border:1px solid var(--border);background:var(--surface2);border-radius:8px;cursor:pointer;font:inherit;color:var(--ink)}
.ds b{font-size:18px;font-weight:800;line-height:1.1}
.ds-w{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.ds-t{font-size:10px;font-weight:700;color:var(--muted);white-space:nowrap}
.ds-off{background:rgba(45,106,48,.08);border-color:rgba(45,106,48,.35)}.ds-off .ds-t{color:var(--green)}
.ds-free{opacity:.6}
.ds.on{background:var(--accent);border-color:var(--accent);color:var(--onfill)}.ds.on .ds-w,.ds.on .ds-t{color:var(--onfill);opacity:.85}
.ds-m{flex:0 0 auto;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);align-self:center}
html,body,*{touch-action:manipulation}
/* iPhone zooms into any text box under 16px when tapped, so phones get 16px boxes */
@media (pointer:coarse){input.in,select.in,textarea.in,label.f .in,label.f select,.actin{font-size:16px}}
.iconbtn:disabled{opacity:.35;cursor:default}
.dn-tools{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.dn-tools label.f{flex:0 0 170px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.fchip{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid;white-space:nowrap}
.fchip.ok,.fv.ok{color:var(--green)} .fchip.ok{border-color:rgba(45,106,48,.4);background:rgba(45,106,48,.08)}
.fchip.warn,.fv.warn{color:var(--orange)} .fchip.warn{border-color:rgba(160,88,40,.45);background:rgba(160,88,40,.1)}
.fchip.bad,.fv.bad{color:var(--red)} .fchip.bad{border-color:rgba(158,42,28,.45);background:rgba(158,42,28,.1)}

  const key=(s.from||"").toUpperCase()+"-"+(s.to||"").toUpperCase();
  const fb = s.kind==="div" ? null : (L.dom[key]!=null ? {m:L.dom[key], intl:false} : L.intl[key]!=null ? {m:L.intl[key], intl:true} : null);

function calc(ym, st){
  st = st || structFor(ym);
  const d = monthData(ym), rank = profile.rank in RANKS ? profile.rank : "fo";
  const r = RATES[st][rank], fx = profile.fixed[st] || {};
  const mon = k=>compOn(k)?(+fx[k]||0)/12:0;
  // Components you added yourself: paid in salary (in gross, taxed) or CTC only
  const extra = (profile.extra||[]).filter(x=>+x.amt>0);
  const fixedLines = [...COMP.filter(c=>c[2]&&compOn(c[0])).map(([k,l])=>[compLabel(k,l),mon(k)]), ...extra.filter(x=>x.cash).map(x=>[x.name||"Other component", x.amt/12])].filter(x=>x[1]>0);
  const fixedCash = fixedLines.reduce((a,x)=>a+x[1],0);
  let opMin=0, dhMin=0;
  for(const s of d.sectors){
    const b=paidBlock(s).m;
    if(s.kind==="dhx") continue;   // unpaid deadhead: duty, but no SOD
    if(s.kind==="dh") dhMin += b; else opMin += b;
  }
  // Training: each day credits fleet average / 22 hours, added to the month's hours.
  // Pay above the guaranteed 40 hours starts only once flying + training passes 40.
  const train = d.train||[], trainDays = train.reduce((a,x)=>a+(+x.days||0),0);
  const fleetAvg = +profile.fleetAvg||40, trainPerDay = fleetAvg/22, trainHrs = trainDays*trainPerDay;
  const bands=[[40,70,r[1]],[70,80,r[2]],[80,90,r[3]],[90,Infinity,r[4]]];
  const above=H=>{ let pay=0; const lines=[]; for(const [lo,hi,rate] of bands){ const h=Math.max(0,Math.min(H,hi)-lo); if(h>0){ lines.push([lo,hi,h,rate]); pay+=h*rate } } return {pay,lines} };
  const flyH = opMin/60, H = flyH + trainHrs, totMin = H*60;
  const {pay:addFly, lines:addLines} = above(H);
  const trainPay = addFly - above(flyH).pay;   // what training added this month
  const sodRate = .65*r[0], sod = dhMin/60*sodRate;
  const domRate = RANKS[rank].dom, domNights = d.dom.reduce((a,x)=>a+(+x.nights||0),0), dom = domNights*domRate;
  const p1 = RANKS[rank].p1;
  const intlRows = d.intl.map(x=>{
    const c=findCountry(x.country), min=+x.mins||0, h=min/60, full=Math.floor(h/24), rem=h-full*24, frac=dayFrac(rem);
    const rate=c?(p1?c.p1:c.p2):0, days=full+frac;

  });

  const gross = fixedCash + addFly + sod + dom;
  const exempt = profile.layoverExempt ? dom : 0;
  const annual = (gross-exempt)*12;
  const isFeb = ym.endsWith("-02"), pt = isFeb?300:200;
  const taxN = taxNew(annual-75000), taxO = taxOld(annual-50000-2500-(+profile.oldDeductions||0));
  const annTax = profile.regime==="old" ? taxO : taxN;
  const tds = annTax/12, pfEe = mon("basic")*.12;
  const net = gross - tds - pfEe - pt;
  return {st, rank, r, fixedLines, fixedCash, opMin, dhMin, H, addLines, addFly, sodRate, sod, domRate, domNights, dom,
    intlRows, intlUSD, trainDays, trainPerDay, trainHrs, trainPay, fleetAvg, totMin, gross, annual, taxN, taxO, tds, pfEe, pt, net, p1,
    hasFixed: fixedCash>0, ctc: COMP.reduce((a,[k])=>a+(compOn(k)?(+fx[k]||0):0),0) + extra.reduce((a,x)=>a+(+x.amt||0),0)};
}

  "IXC ATQ SXR IXJ IXL DED VTZ VGA RJA TIR IXM TRZ CJB IXZ NAG IDR BHO RPR JLR GWL UDR JDH BDQ STV RAJ BHJ IXU NDC IXG HBX MYQ IXY IXK KLH TCR "+

  return {date:`${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())}`, time:`${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`} }

// Paid training, recognised from the calendar title, notes or duty type
function trainingType(summary, desc){
  const t=(summary+" "+desc), code=dutyCode(desc).toUpperCase();
  const isStandby=/stand\s*by|\bSBY\b/i.test(t), isOff=/day off|\bW-?OFF\b|\bR-?OFF\b|\bLEAVE\b/i.test(t);
  if(isOff) return null;
  const trainingWord=/ground duty|training|trg|simulator|\bsim\b|classroom|course|\bcbt\b|cbta|refresher|recurrent|\bcrm\b|\belp\b|\bdgr\b|avsec|agtr|\bppc\b|\bloft\b|\bccq\b|\bmff\b|conversion|upgrade|endorsement|office duty/i.test(t)
    || /^(GRD|GD|GND|TRG|TRN|SIM|CRM|DGR|AVSEC|AGTR|PPC|IR|LOFT|CBT|CBTA|OFC|OFFICE|PADT|ELP|CCQ|MFF)$/.test(code);
  if(!trainingWord) return null;
  if(isStandby) return /train/i.test(t)?TRAIN_TYPES[7]:null;
  if(/\bsim\b|simulator|\bppc\b|\bIR\b|\bloft\b/i.test(t)||/^(SIM|PPC|IR|LOFT)$/.test(code)) return TRAIN_TYPES[1];
  if(/agtr|avsec|\bdgr\b/i.test(t)||/^(AGTR|AVSEC|DGR)$/.test(code)) return TRAIN_TYPES[0];
  // The crew app "Training" events list their course codes; classroom recurrent training (SEP, tech, CRM, AGTR...) is one bucket
  if(/Training Code:/i.test(desc) && !/conversion|upgrade|\bccq\b|\bmff\b|endorsement|cbta|trainer|instructor/i.test(t)) return TRAIN_TYPES[0];
  if(/endorsement/i.test(t)) return TRAIN_TYPES[2];
  if(/cbta|\bcore\b|\boem\b/i.test(t)) return TRAIN_TYPES[3];
  if(/conversion|upgrade|\bccq\b|\bmff\b|command/i.test(t)||/^(CCQ|MFF)$/.test(code)) return TRAIN_TYPES[5];
  if(/\bcrm\b|\belp\b/i.test(t)&&/trainer|instructor|facilitat/i.test(t)) return TRAIN_TYPES[6];

function parseICS(text){
  const lines=String(text).replace(/\r\n|\r/g,"\n").replace(/\n[ \t]/g,"").split("\n");
  const evs=[]; let ev=null;
  for(const line of lines){
    if(line==="BEGIN:VEVENT"){ ev={}; continue }
    if(line==="END:VEVENT"){ if(ev) evs.push(ev); ev=null; continue }
    if(!ev) continue;
    const i=line.indexOf(":"); if(i<0) continue;
    const [name,...ps]=line.slice(0,i).split(";"); const params={};
    for(const p of ps){ const j=p.indexOf("="); if(j>0) params[p.slice(0,j).toUpperCase()]=p.slice(j+1) }
    ev[name.toUpperCase()]={params, value:line.slice(i+1)};

  return expandExport(evs.map(e=>({uid:e.UID&&e.UID.value, summary:un(e.SUMMARY&&e.SUMMARY.value), desc:un(e.DESCRIPTION&&e.DESCRIPTION.value),
    location:un(e.LOCATION&&e.LOCATION.value), status:(e.STATUS&&e.STATUS.value||"").toUpperCase(),
    start:e.DTSTART?icsTime(e.DTSTART):null, end:e.DTEND?icsTime(e.DTEND):null, lm:e["LAST-MODIFIED"]?icsTime(e["LAST-MODIFIED"]):null})).filter(e=>e.start!=null && e.status!=="CANCELLED"));

function ownCode(extra){ const n={}, add=f=>{ const m=/^([A-Z0-9]{2})\d/.exec(f||""); if(m) n[m[1]]=(n[m[1]]||0)+1 };
  for(const ym in months) for(const r of ((months[ym]||{}).sectors||[])) if(!r.example && r.kind!=="dh" && r.kind!=="dhx") add(r.flt);
  (extra||[]).forEach(add);

      // Days off: carry the code (W-OFF, ROFF) the way the subscription does

/* ---------- Moon phase for the day, on the take-home card ----------

  const L=218.316+13.176396*d, M=(134.963+13.064993*d)*rad, D0=(L-Ls)*rad, F=(93.272+13.229350*d)*rad;

/* ---------- Roster PDF (crew app monthly calendar export, times in UTC) ----------

function parseRosterGrid(pages){

  const DOWS=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
  const SH={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};

    if(year==null) continue;
    const cols=items.filter(it=>DOWS.includes(it.s.toLowerCase())).sort((a,b)=>a.x-b.x).map(it=>it.x);
    if(cols.length!==7) continue;
    const colOf=x=>{ let c=0; for(let i=0;i<7;i++) if(x>=cols[i]-6) c=i; return c };
    const headY=Math.min(...items.filter(it=>DOWS.includes(it.s.toLowerCase())).map(it=>it.y));

    const nums=items.filter(it=>it.y<headY-1 && /^(?:[A-Z][a-z]{2}\.?\s*)?\d{1,2}$/.test(it.s) && Math.abs(it.x-cols[colOf(it.x)])<12);
    const rowYs=[...new Set(nums.map(n=>Math.round(n.y)))].sort((a,b)=>b-a);
    const rowOf=y=>{ let r=-1; for(let i=0;i<rowYs.length;i++) if(y<rowYs[i]+1) r=i; return r };
    const cells=new Map();
    for(const n of nums){ const r=rowYs.indexOf(Math.round(n.y)), c=colOf(n.x), m=n.s.match(/^(?:([A-Z][a-z]{2})\.?\s*)?(\d{1,2})$/);

      else if(r===0 && d>20) { mo=month-1; if(mo<0){ mo=11; yr-- } }

  const ev=new Map(rosterEvents.filter(e=>e.t==="sector").map(e=>[e.uid,e]));

    const typed=Date.parse(r.date+"T"+r.dep+":00Z"), t=e.pStart||e.start; if(isNaN(typed)) continue; const diff=(t-typed)/MIN; if(Math.abs(diff-330)>2 && Math.abs(diff+1110)>2) continue;   // 5:30, or 5:30 with the date left a day late

function buildDuties(){

  const mine=e=>{ const r=e.t==="sector"&&own.get(e.uid); if(!r) return e;
    let st=Date.parse(r.date+"T"+r.dep+":00Z"); if(isNaN(st)) return e;
    if(r.report){ const rp=Date.parse(r.date+"T"+r.report+":00Z"); if(!isNaN(rp)&&st<rp) st+=DAY }
    const cal = e.aStart!=null ? {s:e.aStart,e:e.aEnd} : (isRewrite(e,Date.now()) ? {s:e.start,e:e.end} : null);
    return {...e, start:st, end:st+(+r.fixed)*MIN, noPlan:false, aStart:cal?cal.s:null, aEnd:cal?cal.e:null} };
  const ev=[...rosterEvents.map(mine), ...logEvents(), ...mySbyEvents()].sort((a,b)=>a.start-b.start || ((a.t==="checkin"?0:1)-(b.t==="checkin"?0:1)) || ((a.manual?1:0)-(b.manual?1:0))), duties=[], standbys=[];

  const close=(endMs, stn)=>{ if(!cur) return; cur.signoutPlanned=endMs; cur.signoutStn=stn||""; duties.push(cur); cur=null };
  for(let i=0;i<ev.length;i++){ const e=ev[i];

    if(e.t==="checkin" && cur && !cur.items.length && Math.abs(e.start-cur.report)<2*MIN) continue;   // the same check-in twice

        if(last && last.items.length && e.start-last.items[last.items.length-1].end<=4*HR && e.start>=last.items[last.items.length-1].end){ cur=duties.pop(); cur.items.push(e); continue } }

  const kept=[];
  for(const d of duties){

  for(const a of kept.filter(d=>!d.items.length)){ const d=pick(a.report,a.signoutPlanned,a.uid);

}

function evalDuty(d){
  if(!d.items.length){
    const a=actuals[d.uid]||{}, rp=d.report, ra=nearUTC(a.report,d.report);
    const mk=R=>({report:R, signout:d.signoutPlanned, fdpEnd:null, fdp:null, duty:(d.signoutPlanned-R)/MIN, ft:0, landings:0, night:false, lim:fdpLimits(0,false), note3:0, halts:[]});

  }

  const rep={plan:airport?d.sby.start:d.report, act:d.report>Date.now()+2*HR?null:(nearUTC(a.report,d.report) ?? (d.aReport!=null && d.aReport!==d.report ? d.aReport : null))};
  const nofly = !!a.nofly && (d.items.some(x=>x.t==="sector"));

    const lastItemEnd = Math.max(...d.items.map(x=> x.t==="sector"?T(secs.find(y=>y.uid===x.uid)).on : x.end));
    const plannedTail = d.signoutPlanned - Math.max(...d.items.map(x=>x.end));

    const lastIt=d.items[d.items.length-1];
    if(lastIt && lastIt.t==="sector" && lastIt.kind==="op" && !isDomStn(lastIt.from) && isDomStn(lastIt.to)) signout=Math.max(signout, lastItemEnd+30*MIN);

/* Rest before each duty and standby/local-night rules; cumulative windows */
function fdtlAll(){
  const {duties, standbys}=buildDuties();
  for(let i=0;i<duties.length;i++){
    const d=duties[i], prev=duties[i-1];
    for(const k of ["P","A"]){
      const x=d[k];
      if(!prev){ x.rest=null; continue }
      const p=prev[k], avail=(x.report-p.signout)/MIN;
      const flying = d.type==="flight" || d.type==="positioning";   // the next duty includes flying or positioning
      const {req, why}=restNeed(prev, p, flying);
      const sb=flying ? standbys.filter(s=>!s.called && s.end<=x.report && s.end>p.signout && !(x.report>=s.start && x.report<=s.end)).pop() : null;
      const needNight = p.duty>18*60;
      const sbReq=720+30+transportFor(prev.restStn);   // home standby: 12 h + 0:30 domestic + transport to the airport
      if(sb && sb.end+sbReq*MIN>p.signout+req*MIN){   // the standby is the binding rest: measure from its end
        x.rest={avail:(x.report-sb.end)/MIN, req:sbReq, why:["12 h from the end of your standby before a flight", "+0:30 at a domestic station", `+${hm(transportFor(prev.restStn))} transport to the airport`], needNight, nightOk: !needNight || containsLocalNight(p.signout, x.report), from:sb.end, stn:prev.restStn};
        continue }
      x.rest={avail, req, why, needNight, nightOk: !needNight || containsLocalNight(p.signout, x.report), from:p.signout, stn:prev.restStn};
    }
  }
  // The earliest flight you could take after each duty (for the panel at the foot of its card)
  for(const d of duties) for(const k of ["P","A"]){ const x=d[k], n=restNeed(d, x, true);
    let rep=x.signout+n.req*MIN, why=[...n.why];
    const stn=d.restStn||"", T=transportFor(stn), intlStn=!isDomStn(stn);
    if(x.duty>18*60){ // the rest must include a local night: 00:00-08:00 IST between getting there and leaving again
      const home=x.signout+T*MIN; let ns=Math.floor((home+IST_OFF)/DAY)*DAY-IST_OFF; if(ns<home) ns+=DAY;
      const r2=ns+8*HR+T*MIN; if(r2>rep){ rep=r2; why.push("must include a local night, 00:00-08:00 IST") } }
    x.next={report:rep, dom:intlStn?null:rep+REPORT_DOM*MIN, intl:rep+intlLead(stn)*MIN, train:x.signout+(600+2*T)*MIN, why, stn, intlStn, T} }
  const all={duties, standbys};
  for(const k of ["P","A"]) all["wk"+k]=cycleRules(all, k);
  return all;
}
// transport to and from the airport is neither duty nor rest (45 min at domestic stations, 30 min at
// international ones), and a domestic station adds 30 min of rest before a flight duty. Report 1:00
// before a domestic departure, 1:15 before an international one from a metropolitan station, 1:00 otherwise.
const REPORT_DOM=60, REPORT_INTL_METRO=75;
const METROS=new Set(["BOM","DEL","MAA","HYD","BLR","CCU","NMI"]);
const isDomStn = stn=>!stn || IN_AIRPORTS.has(stn);
const transportFor = stn=>isDomStn(stn)?45:30;
const intlLead = stn=>METROS.has(stn)?REPORT_INTL_METRO:REPORT_DOM;
// Rest needed between a duty (x is its planned or actual figures) and the next one
function restNeed(prev, p, flying){
  const stn=prev.restStn||"", T=transportFor(stn), dom=isDomStn(stn);
  let req, why=[];
  if(!flying){ req=600; why.push("10 h before duties other than flying") }
  else if(prev.type==="asby"){ req=Math.max(720,p.duty); why.push("12 h after standby before a flight") }
  else { req=Math.max(p.duty,720); why.push(p.duty>720?"as long as the previous duty":"12 h minimum") }
  if(p.note3>0){ req+=2*p.note3; why.push(`+${hm(2*p.note3)} after flying in 00:00-01:59 or 05:01-06:00 IST`) }
  if(p.ext && (p.ext.ft>0||p.ext.fdp>0)){ const add=(p.ext.fdp<=60&&p.ext.ft<=30)?120:240; req+=add; why.push(`+${hm(add)} after an extension of ${hm(p.ext.fdp)} FDP / ${hm(p.ext.ft)} flight time`) }
  if(p.nofly){ const r2=Math.max(720,2*p.duty); if(r2>req){ req=r2; why.length=0; why.push(`twice the ${hm(p.duty)} you spent after reporting, at least 12 h`) } }
  if(flying && dom){ req+=30; why.push("+0:30 at a domestic station") }
  req+=2*T; why.push(`+${hm(2*T)} transport, ${T} min each way at ${dom?"a domestic":"an international"} station (neither duty nor rest)`);
  return {req, why};
}

/* Weekly rest, consecutive nights, Note 3 frequency and early-morning reports, per mode (P planned, A actual) */
const istDate = ms=>new Date(ms+IST_OFF).toISOString().slice(0,10);
const istMin  = ms=>{ const d=new Date(ms+IST_OFF); return d.getUTCHours()*60+d.getUTCMinutes() };
function nightsIn(a,b){ // local nights (00:00-08:00 IST) lying wholly inside [a,b]
  const out=[]; const d0=Math.floor((a+IST_OFF)/DAY), d1=Math.floor((b+IST_OFF)/DAY);
  for(let d=d0; d<=d1; d++){ const s=d*DAY-IST_OFF; if(s>=a && s+8*HR<=b) out.push(s) } return out;
}
function cycleRules(all, k){
  const base=(profile.base||"BOM").toUpperCase();
  const D=all.duties.map(d=>({d, x:d[k]}));
  // Busy periods: every duty and standby (rest means free of duty, standby and reserve)
  const busy=[...D.map(o=>({a:o.x.report, b:o.x.signout, d:o.d})), ...all.standbys.map(s=>({a:s.start, b:s.end, sby:true}))].sort((p,q)=>p.a-q.a);
  const nightFdp=D.filter(o=>o.x.night).map(o=>o.x.report);
  const rests=[];
  let endSoFar=null, lastBusy=null;
  for(const bz of busy){
    if(endSoFar!=null && bz.a>endSoFar){
      const a=endSoFar, b=bz.a, hrs=(b-a)/MIN;
      if(hrs>=48*60){
        const nights=nightsIn(a,b);
        // sign out by 23:14 LT, so a night that starts less than 46 min after sign-out does not count
        const counted=nights.filter(n=>n-a>=46*MIN);
        const n3=nightFdp.filter(r=>r<a && r>=a-168*HR).length;
        const req=n3>3?60*60:48*60;
        const stn=(lastBusy&&lastBusy.d&&lastBusy.d.restStn)||"";
        const ok=hrs>=req && counted.length>=2;
        const tbKey="tb|"+stn+"|"+istDate(a), temp=!!(actuals[tbKey]&&actuals[tbKey].tb);
        rests.push({a,b,hrs,nights:nights.length,counted:counted.length,req,n3,stn,away:!!stn&&stn!==base&&!temp,temp,tbKey,ok,
          lateSignout: nights.length>counted.length});
      }
    }
    if(endSoFar==null || bz.b>endSoFar){ endSoFar=bz.b; lastBusy=bz }
  }
  const valid=rests.filter(r=>r.ok);
  // Per duty
  const nightDates=new Map();   // IST date of a 00:00-06:00 window -> duties touching it
  for(const o of D){ if(o.x.fdpEnd==null || !o.x.night) continue;
    const d0=Math.floor((o.x.report+IST_OFF)/DAY), d1=Math.floor((o.x.fdpEnd+IST_OFF)/DAY);
    for(let d=d0; d<=d1; d++){ const s=d*DAY-IST_OFF; if(Math.min(o.x.fdpEnd,s+6*HR)>Math.max(o.x.report,s)) nightDates.set(d,(nightDates.get(d)||[]).concat(o.d.uid)) } }
  const nd=[...nightDates.keys()].sort((p,q)=>p-q), runOf=new Map(), runs=[];
  for(let i=0;i<nd.length;i++){ const len=(i>0&&nd[i-1]===nd[i]-1)?runOf.get(nd[i-1]).len+1:1; const start=len>1?runOf.get(nd[i-1]).start:nd[i];
    runOf.set(nd[i],{len,start}) }
  for(const [day,r] of runOf) if(r.len===3) runs.push(day);   // the day each run reaches 3 nights
  const per=new Map(); let early=0, lastRestEnd=null;
  for(const o of D){
    const x=o.x;
    const prevRest=valid.filter(r=>r.b<=x.report).pop();
    if(prevRest && prevRest.b!==lastRestEnd){ early=0; lastRestEnd=prevRest.b }
    const isEarly=istMin(x.report)<6*60;   // RP: early morning = report 00:00-06:00 IST
    early=isEarly?early+1:0;
    const since=prevRest?(x.signout-prevRest.b)/MIN:null;
    // consecutive nights for the nights this duty touches
    let nights=null;
    for(const [day,uids] of nightDates) if(uids.includes(o.d.uid)){ const r=runOf.get(day);
      const threes=runs.filter(t=>t<=day && (day-t)*DAY<168*HR);   // runs of 3 that reached 3 in the last 168 h, this one included
      const n={len:r.len, threes:threes.length}; if(!nights || n.len>nights.len || n.threes>nights.threes) nights=n }
    const n3=x.note3>0 ? D.filter(q=>q.x.note3>0 && q.x.report<=x.report && q.x.report>x.report-168*HR).length : 0;
    let ext28=null;
    if(x.ext){ ext28={ft:0,fdp:0}; for(const q of D) if(q.x.ext && q.x.report<=x.report && q.x.report>x.report-28*DAY){ ext28.ft+=q.x.ext.ft; ext28.fdp+=q.x.ext.fdp } }
    per.set(o.d.uid,{since, prevRest, early: isEarly?early:0, nights, n3, ext28});
  }

}
function cumulative(all, dayEndMs, mode){
  const out=[];
  for(const [days,ftL,dutyL] of [[7,35,60],[14,65,100],[28,100,190],[90,300,600],[365,1000,1800]]){
    const from=dayEndMs-days*DAY, partial=from<FDTL_START;
    let ft=0, duty=0;
    for(const d of all.duties){ const x=d[mode];
      if(x.report>=from && x.report<dayEndMs){ ft+=x.ft; duty+=x.duty } }

    chk.push(`<tr><td>Standby period<span class="rtime">Airport standby, max 8 h. Not called out, so all of it counts as duty</span></td><td class="n">8:00</td>${cell(P.duty,480,hm)}${act?cell(A.duty,480,hm):'<td class="n muted">–</td>'}</tr>`);
  } else {
    chk.push(`<tr><td>Duty period<span class="rtime">Counts towards cumulative duty</span></td><td class="n muted">–</td><td class="n">${hm(P.duty)}</td><td class="n">${act?hm(A.duty):"–"}</td></tr>`);
  }
  // Extension
  const extSt=[];
  if(d.ext){
    const e=(act?A:P).ext;
    if(e){ const st1=e.ft>90||e.fdp>180||e.land>1?"bad":"ok";
      chk.push(`<tr><td>Extension used<span class="rtime">Up to 1:30 flight time, 3:00 FDP and one extra landing for a diversion</span></td><td class="n">3:00</td><td class="n" colspan="2"><span class="fv ${st1}">${hm(e.fdp)} FDP · ${hm(e.ft)} FT${e.land?` · +${e.land} landing`:""}</span></td></tr>`); extSt.push(st1) }
    const w=fdtlCache&&fdtlCache["wk"+(act?"A":"P")].per.get(d.uid), x28=w&&w.ext28;
    if(x28){ const st2=x28.ft>240||x28.fdp>480?"bad":(x28.ft>=216||x28.fdp>=432)?"warn":"ok";
      chk.push(`<tr><td>Extensions in 28 days<span class="rtime">At most 4:00 flight time and 8:00 FDP</span></td><td class="n">8:00</td><td class="n" colspan="2"><span class="fv ${st2}">${hm(x28.fdp)} FDP · ${hm(x28.ft)} FT</span></td></tr>`); extSt.push(st2) } }
  // Step 2: weekly-rest cycle, consecutive nights, Note 3 frequency, early mornings
  const all2=fdtlCache, wP=all2&&all2.wkP.per.get(d.uid), wA=all2&&all2.wkA.per.get(d.uid);
  const cyc=[];   // statuses for the overall chip
  if(wP){
    const pair=(fP,fA)=>`<td class="n">${fP(wP)}</td>`+(act&&wA?`<td class="n">${fA(wA)}</td>`:`<td class="n muted">–</td>`);
    const vc=(st,txt)=>`<span class="fv ${st}">${txt}</span>`;
    const sinceSt=w=> w.since==null?"na":fdtlStatus(w.since,168*60);
    if(wP.since==null) chk.push(`<tr><td>Since your last weekly rest<span class="rtime">No weekly rest on record yet (history starts 1 Oct)</span></td><td class="n">168:00</td><td class="n" colspan="2"><span class="fv na">Not checked</span></td></tr>`);
    else { chk.push(`<tr><td>Since your last weekly rest<span class="rtime">Last one ended ${hhmmZ(wP.prevRest.b)}Z ${esc(DOW(utcDate(wP.prevRest.b)))}; the next must start within 168 h</span></td><td class="n">168:00</td>${pair(w=>vc(sinceSt(w),hm(w.since)),w=>vc(sinceSt(w),hm(w.since)))}</tr>`);
      cyc.push(sinceSt(wP)); if(act&&wA) cyc.push(sinceSt(wA)) }
    const nSt=n=>!n?"ok":n.len<=2?"ok":(n.len===3&&n.threes<=1)?"warn":"bad";
    if(wP.nights||(act&&wA&&wA.nights)){
      const nTxt=w=>w.nights?vc(nSt(w.nights),w.nights.len):"–";
      chk.push(`<tr><td>Night duties in a row<span class="rtime">Touching 00:00–06:00 IST; 3 allowed once in 168 h${[wP,wA].some(w=>w&&w.nights&&nSt(w.nights)==="warn")?". This uses the once-in-168 h allowance":""}</span></td><td class="n">2</td>${pair(nTxt,nTxt)}</tr>`);
      cyc.push(nSt(wP.nights)); if(act&&wA) cyc.push(nSt(wA.nights)) }
    const n3St=w=>w.n3>4?"bad":"ok";
    if(wP.n3||(act&&wA&&wA.n3)){
      const t=w=>w.n3?vc(n3St(w),w.n3):"–";
      chk.push(`<tr><td>Note 3 duties in 168 h<span class="rtime">In the last 168 h</span></td><td class="n">4</td>${pair(t,t)}</tr>`);
      cyc.push(n3St(wP)); if(act&&wA) cyc.push(n3St(wA)) }
    const eSt=w=>w.early>3?"warn":"ok";
    if(wP.early||(act&&wA&&wA.early)){
      const t=w=>w.early?vc(eSt(w),w.early):"–";
      chk.push(`<tr><td>Early-morning reports in a row<span class="rtime">Reporting 00:00–06:00 IST; a 4th needs your consent</span></td><td class="n">3</td>${pair(t,t)}</tr>`);
      cyc.push(eSt(wP)); if(act&&wA) cyc.push(eSt(wA)) }
  }
  const rp=P.rest, ra=A.rest;
  if(rp){
    const restCell=r=> r ? `<td class="n"><span class="fv ${r.avail+0.01<r.req||!r.nightOk?"bad":r.avail<r.req*1.1?"warn":"ok"}">${hm(r.avail)}</span></td>` : '<td class="n muted">–</td>';
    const er=rp.from+rp.req*MIN;
    chk.push(`<tr><td>Rest before this duty<span class="rtime" style="white-space:normal">${esc(rp.why.join("; "))}${rp.needNight?"; must include a local night":""}</span><span class="rtime" style="white-space:normal">${d.type==="flight"||d.type==="positioning"?`<b>This duty could depart from ${isDomStn(rp.stn)&&intlLead(rp.stn)!==REPORT_DOM?`${hhmmZ(er+REPORT_DOM*MIN)}Z if domestic, ${hhmmZ(er+intlLead(rp.stn)*MIN)}Z if international`:`${hhmmZ(er+(isDomStn(rp.stn)?REPORT_DOM:intlLead(rp.stn))*MIN)}Z`}</b> (report from ${hhmmZ(er)}Z ${esc(DOW(utcDate(er)))})`:`<b>Earliest report ${hhmmZ(er)}Z ${esc(DOW(utcDate(er)))}</b>`}</span></td><td class="n">${hm(rp.req)}</td>${restCell(rp)}${act?restCell(ra):'<td class="n muted">–</td>'}</tr>`);
  } else chk.push(`<tr><td>Rest before this duty<span class="rtime">No earlier duty on record (history starts 1 Oct)</span></td><td class="n muted">–</td><td class="n" colspan="2"><span class="fv na">Not checked</span></td></tr>`);

  const worst=[...[P,act?A:null].filter(Boolean).flatMap(x=> d.type==="flight"?[x.landings>x.lim.land?"bad":"ok",fdtlStatus(x.ft,x.lim.ft),fdtlStatus(x.fdp,x.lim.fdp),fdtlStatus(x.duty,x.lim.fdp+60)]:d.type==="asby"?[fdtlStatus(x.duty,480)]:[]),
    ...[rp,act?ra:null].filter(Boolean).map(r=>r.avail+0.01<r.req||!r.nightOk?"bad":r.avail<r.req*1.1?"warn":"ok"), ...cyc.filter(x=>x!=="na"), ...extSt, ...(d.sby&&d.report>d.sby.end+60000?["bad"]:[]), ...chgStatus(d)];
  const overall=worst.includes("bad")?"bad":worst.includes("warn")?"warn":"ok"; d._overall=overall;
  const planOnlyBad = act && ["bad"].includes(overall) && ![fdtlStatus(P.fdp,P.lim.fdp),fdtlStatus(P.ft,P.lim.ft),fdtlStatus(P.duty,P.lim.fdp+60)].includes("bad");
  const notes=[];
  if(X.night) notes.push(`Night duty: the FDP touches 00:00–06:00 IST, so the limits are 8 h flight time, 10:00 FDP and 2 landings.`);
  if(X.note3>0) notes.push(`${hm(X.note3)} of this FDP falls in 00:00–01:59 or 05:01–06:00 IST, so the next rest is ${hm(2*X.note3)} longer.`);
  for(const h of X.halts) if(h.mins>=180) notes.push(`The ${hm(h.mins)} halt at ${esc(h.stn)} is long enough for split duty, which can extend the FDP only with suitable accommodation. Not applied here.`);
  if(planOnlyBad && !d.ext) notes.push(`Legal as rostered, exceeded on the actual times you entered. If this was due to unforeseen operational circumstances, mark it as an extension below.`);
  if(d.sby){ const m=X.sbyMins||0;
    if(d.sby.kind==="airport") notes.push(`Called out from airport standby: its ${hm(m)} counts in full towards FDP and duty, so the FDP starts at the standby.`);
    else if(X.sbyCut) notes.push(`Called out from home standby after ${hm(m)}: the FDP limit drops by half the standby time, ${hm(X.sbyCut)}.`);
    else notes.push(`Called out from home standby after ${hm(m)}, within the first 6 h: no standby counts towards FDP or duty.`);
    if(d.report>d.sby.end+60000) notes.push(`The report is after the standby ended. A call-out's report must fall within the standby period.`); }
  if(d.nofly) notes.push(`Cancelled after you reported. The next duty needs rest of twice the time from report to release, at least 12 h. Pay still follows your Flight log.`);
  for(const c of chgFor(d)) notes.push(chgText(c, d.P.report));
  return `<section class="card duty">
    <div class="dhead"><div><h2>${esc(typeName)}</h2><p class="sub">${esc(route||d.trn.map(t=>t.code).join(", ")||(d.type==="asby"?`${d.checkinStn||""} ${hhmmZ(P.report)}–${hhmmZ(P.signout)}Z`.trim():""))}</p></div>${chipFor(overall, overall==="ok"?"Legal":overall==="warn"?"Close to a limit":"Limit exceeded")}</div>
    ${ganttBar(d, X)}
    <div class="tbl"><table class="tl"><thead><tr><th>UTC <button class="refbtn" type="button" data-ref="tl|${esc(d.uid)}" aria-label="Show how to enter times">🔽</button></th><th class="n">Planned</th><th class="n">Actual</th><th class="n">Diff</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>
    <p class="note refx" data-refof="tl|${esc(d.uid)}">${d.secs.some(s=>s.aStart!=null)?"Actual times came from your calendar, which the crew app updates after each flight. ":""}Type actual times in UTC as 14:35 or 1435. Actual times are used for FDTL, and for pay only where a sector is paid on actual block (a diversion, or a sector not on your fixed block list). If Crew Control moved your report before you left home, the revised time is your actual report.</p>
    <div class="tbl"><table class="chk"><thead><tr><th>Check</th><th class="n">Limit</th><th class="n">Planned</th><th class="n">Actual</th></tr></thead><tbody>${chk.join("")}</tbody></table></div>
    ${notes.length?`<ul class="fnotes">${notes.map(n=>`<li>${n}</li>`).join("")}</ul>`:""}
    ${nextPanel(d)}
    ${d.type==="asby"?(String(d.uid).startsWith("msby|")?"":sbyPick(d.uid,"airport"))+callPick(d.uid):""}
    ${String(d.uid).startsWith("msby|")?"":rmBtn(d.uid, d.date, typeName+(route?" "+route:""))}
    ${d.secs.length?`<div class="flags">
      <label class="chk"><input type="checkbox" data-flag="nofly" data-uid="${esc(d.uid)}"${d.nofly?" checked":""}> Cancelled after I reported (no flying)</label>
      ${d.type==="flight"&&(d.ext||overall==="bad")?`<label class="chk"><input type="checkbox" data-flag="ext" data-uid="${esc(d.uid)}"${d.ext?" checked":""}> Extended (unforeseen operational circumstances)</label>`:""}
    </div>`:""}
  </section>`;
}
// The crew app sometimes exports a standby as a bare check-in/check-out; let the pilot say which kind it was
function sbyPick(uid, val){
  return `<div class="btns sbypick"><span class="muted">Your calendar shows this as a check-in and check-out only.</span>
    <label class="f">Standby type<select class="in" data-sby="${esc(uid)}"><option value="home"${val==="home"?" selected":""}>Home standby (25% counts)</option><option value="airport"${val==="airport"?" selected":""}>Airport standby (100% counts)</option></select></label></div>`;
}
function nextPanel(d){
  const X=d.hasActual?d.A:d.P, n=X.next; if(!n) return "";

    </div>

// A day off from the roster, and whether it sits inside a weekly rest that meets the limits
function offCard(all, day, off){
  const d0=Date.parse(day+"T00:00:00Z"), d1=d0+DAY;
  const wr=all.wkA.rests.find(r=>r.a<d1 && r.b>d0);

}
function rmBtn(uid, date, label){

function callPick(uid){

// Roster changes that touch a duty, and how much notice there was
function chgFor(d){ const a=d.P.report-HR, b=d.P.signout;
  return rosterChanges.filter(c=>{ const t=c.newStart??c.oldStart; return t>=a && t<=b }) }
function chgStatus(d){ return chgFor(d).map(c=>chgLevel(c, d.P.report)).filter(x=>x!=="ok") }
function chgLevel(c, report){ return c.dayOff || (report-c.at)<12*HR ? "warn" : "ok" }
const WHAT={checkin:"Report",sector:"Sector",training:"Training",standby:"Standby",off:"Day off"};
function chgText(c, report){
  const what=WHAT[c.t]||"Duty", tz=t=>`${hhmmZ(t)}Z ${DOW(utcDate(t))}`;
  const name=c.t==="sector"?(c.s||"").replace(/^[^A-Za-z]*/,""):what;
  const body = c.kind==="moved" ? `${name} moved from ${tz(c.oldStart)} to ${tz(c.newStart)}`
    : c.kind==="added" ? `${name} added at ${tz(c.newStart)}` : `${name} removed (was ${tz(c.oldStart)})`;
  const notice=report!=null?(report-c.at)/MIN:null;
  const n = notice==null||c.kind==="removed" ? "" : notice<12*60 ? ` Notice ${hm(Math.max(0,notice))}, under 12 h before report, so it needed your consent.` : ` Notice ${hm(notice)} before report.`;
  const off = c.dayOff ? ` This touched a published day off, which needs your consent.` : "";
  return `Roster change, in your calendar by ${tz(c.at)}: ${esc(body)}.${n}${off}`;
}
function changesCard(day, list){
  const cs=rosterChanges.filter(c=>utcDate(c.newStart??c.oldStart)===day && !list.some(d=>chgFor(d).includes(c)));
  if(!cs.length) return "";
  const lvl=cs.some(c=>c.dayOff)?"warn":"ok";
  return `<section class="card duty"><div class="dhead"><div><h2>Roster changes</h2><p class="sub">Seen between your pastes</p></div>${chipFor(lvl, lvl==="ok"?"Noted":"Check consent")}</div>
    <ul class="fnotes">${cs.map(c=>`<li>${chgText(c, c.newStart)}</li>`).join("")}</ul></section>`;
}
function haltRow(h){
  const tag = h.mins>360?"hotel may be provided (over 6 h)":h.mins>150?"lounge with meals (over 2.5 h)":"";

}
const diffTxt=m=>{ m=Math.round(m); return m===0?"0:00":(m>0?"+":"−")+hm(Math.abs(m)) };
function normHHMM(v){ v=String(v||"").trim(); if(!v) return ""; const m=v.match(/^(\d{1,2}):?(\d{2})$/); if(!m||+m[1]>23||+m[2]>59) return null; return String(+m[1]).padStart(2,"0")+":"+m[2] }

/* ---------- Explanations behind a toggle: 🔽 shows, 🔼 hides ---------- */
const openRefs=new Set();
function decorateRefs(){
  // Check tables: the grey explanation lines under each check go behind a toggle beside its name
  document.querySelectorAll("#view table.chk tbody tr").forEach(tr=>{
    const td=tr.cells[0]; if(!td) return; const rs=[...td.querySelectorAll(".rtime")]; if(!rs.length) return;
    const card=tr.closest(".card"), head=card?((card.querySelector(".dhead h2")||{}).textContent||"")+" "+((card.querySelector(".dhead .sub")||{}).textContent||""):"";
    const key="chk|"+head.trim()+"|"+(td.firstChild&&td.firstChild.textContent||"").trim();
    rs.forEach(r=>{ r.classList.add("refx"); r.dataset.refof=key });
    const b=document.createElement("button"); b.type="button"; b.className="refbtn"; b.dataset.ref=key; td.insertBefore(b, rs[0]);
  });
  document.querySelectorAll("#view .refbtn").forEach(b=>setRef(b.dataset.ref, openRefs.has(b.dataset.ref)));
}
function setRef(key, open){
  document.querySelectorAll(".refbtn").forEach(b=>{ if(b.dataset.ref!==key) return; b.textContent=open?"🔼":"🔽"; b.setAttribute("aria-expanded",String(open)); b.setAttribute("aria-label", open?"Hide explanation":"Show explanation") });
  document.querySelectorAll(".refx").forEach(el=>{ if(el.dataset.refof===key) el.classList.toggle("ref-open", open) });
}

const byDate=(a,b)=>(a.date||"").localeCompare(b.date||"");
// A duty dated by its check-in can depart after midnight UTC, so order flights by when they actually leave
function sortSectors(L){ const ev=new Map(rosterEvents.filter(e=>e.t==="sector").map(e=>[e.uid,e]));
  const at=r=>{ const e=r.uid&&ev.get(r.uid); if(e) return e.pStart||e.start;
    let t=Date.parse((r.date||"9999-12-31")+"T"+(/^\d\d:\d\d$/.test(r.dep||"")?r.dep:/^\d\d:\d\d$/.test(r.report||"")?r.report:"23:59")+":00Z");
    if(r.dep&&r.report&&r.dep<r.report) t+=DAY; return isNaN(t)?Infinity:t };
  return L.sort((a,b)=>byDate(a,b) || at(a)-at(b)) }
function sortMonth(d){ sortSectors(d.sectors); d.dom.sort(byDate); d.intl.sort(byDate); if(d.train) d.train.sort(byDate) }


/* ---------- Flights list (lab revamp) ----------

/* ---------- Quals: card validity, recency and Category C aerodromes (lab) ----------
   Card items come from the competency card PDF, read on this phone with pdf.js. Only each item's name and dates are
   kept; everything else on the card is ignored and never stored. Every new upload replaces the card data.
   Recency: 3 takeoffs and 3 landings as PF in the preceding 90 days (aircraft or simulator of the type), and in any
   30 days an operating sector, or a simulator takeoff and landing as PF. Takeoffs and landings come from the T/O and
   LDG ticks on the data card, plus any added here. Aerodrome competence lasts 12 months from the last operation. */

const isoToday=()=>new Date().toISOString().slice(0,10);
const isoAdd=(d,n)=>{ const t=new Date(d+"T00:00:00Z"); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10) };
const isoAddYear=d=>{ const t=new Date(d+"T00:00:00Z"); t.setUTCFullYear(t.getUTCFullYear()+1); return t.toISOString().slice(0,10) };
const daysTo=d=>Math.round((Date.parse(d+"T00:00:00Z")-Date.parse(isoToday()+"T00:00:00Z"))/864e5);
function qStatus(d, amber, red){ if(d==null) return "none"; if(d<0||d<=red) return "bad"; if(d<=amber) return "warn"; return "ok" }
const qLeft=d=>d==null?"":d<0?`expired ${-d} day${d===-1?"":"s"} ago`:d===0?"last day today":`${d} day${d===1?"":"s"} left`;

// sectors that have started (planned departure in the past)
function flownSectors(){ const now=Date.now(), out=[];
  for(const ym of Object.keys(months)) for(const s of (months[ym].sectors||[])){ if(!s.date) continue;
    const t=Date.parse(s.date+"T"+(/^\d\d:\d\d$/.test(s.dep||"")?s.dep:"00:00")+":00Z"); if(t<=now) out.push(s) }
  return out }

/* ---- recency ---- */
function recency(){ const q=qualsData(), w=q.warn, today=isoToday(), T=[], Lg=[], ops=[];
  for(const s of flownSectors()){ const c=cards[cardKey(s)]||{};
    if(c.rto==="Y") T.push(s.date);
    if(c.rldg==="Y") Lg.push(s.date);
    if(s.kind==="op"||s.kind==="div") ops.push(s.date) }
  for(const x of q.extra){ if(!/^\d{4}-\d\d-\d\d$/.test(x.date||"")||x.date>today) continue;
    const nt=+x.to||0, nl=+x.ldg||0;
    for(let i=0;i<nt;i++) T.push(x.date);
    for(let i=0;i<nl;i++) Lg.push(x.date);
    if(x.sim ? (nt>0&&nl>0) : (nt>0||nl>0)) ops.push(x.date) }
  T.sort().reverse(); Lg.sort().reverse(); ops.sort();
  const from90=isoAdd(today,-90);
  const u90 = T.length>=3&&Lg.length>=3 ? [isoAdd(T[2],90),isoAdd(Lg[2],90)].sort()[0] : null;
  const lastOp=ops.length?ops[ops.length-1]:null, u30=lastOp?isoAdd(lastOp,30):null;
  const d90=u90?daysTo(u90):null, d30=u30?daysTo(u30):null;
  return {T, Lg, n90T:T.filter(d=>d>=from90).length, n90L:Lg.filter(d=>d>=from90).length,
    u90, d90, s90:qStatus(d90,w.ra,w.rr), lastOp, u30, d30, s30:qStatus(d30,w.ra,w.rr)} }

/* ---- competency card ---- */
const QMON={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
function qDate(s){ const m=String(s||"").trim().match(/^(\d{1,2})-([A-Za-z]{3})-(\d{2}|\d{4})$/); if(!m) return null;
  const mo=QMON[m[2].toUpperCase()]; if(!mo) return null; let y=+m[3]; if(y<100) y+=2000;
  return y+"-"+String(mo).padStart(2,"0")+"-"+m[1].padStart(2,"0") }
const Q_ALIAS={IREND:"IR"};
function qLabel(l){ l=String(l||"").trim(); if(Q_ALIAS[l]) return Q_ALIAS[l];
  const w=l.split(/\s+/); if(w.length===1) return l==="MEDICAL"?"Medical":l;
  return w.map((x,i)=>{ const plain=/^[A-Z]{4,}$/.test(x)||/^(AND|OF|THE|WET)$/.test(x); if(!plain) return x; const lo=x.toLowerCase(); return i?lo:lo[0].toUpperCase()+lo.slice(1) }).join(" ") }
const qGroup=g=>/LICEN|MEDICAL|DOCUMENT/i.test(g)?"Licences and medical":/GROUND/i.test(g)?"Ground training":/SIM/i.test(g)?"Simulator":/LINE/i.test(g)?"Line":g?g[0]+g.slice(1).toLowerCase():"Other";
// Rows are "serial, item, [number], date, date". Lines with a colon (personal details) are skipped and never kept.
function parseCompCard(pages){ const items=[]; let group="", cardDate="";
  for(const its of pages){ const rows=[];
    for(const it of its){ let r=rows.find(r=>Math.abs(r.y-it.y)<=3); if(!r){ r={y:it.y,c:[]}; rows.push(r) } r.c.push(it) }
    rows.sort((a,b)=>b.y-a.y);
    for(const r of rows){ const c=r.c.sort((a,b)=>a.x-b.x).map(x=>x.s), line=c.join(" ");
      const cm=line.match(/created\s*on\s*:?\s*(\d{1,2}-[A-Za-z]{3}-\d{2,4})/i); if(cm){ cardDate=qDate(cm[1])||""; continue }
      if(/:/.test(line)) continue;
      if(c.length>=2 && /^\d{1,2}$/.test(c[0]) && !/\d/.test(c[1])){
        const rest=c.slice(2), ds=rest.map(qDate).filter(Boolean), na=rest.some(x=>/^N\/?A$/i.test(x));
        let from=ds.length>=2?ds[0]:"", to=ds.length>=2?ds[1]:(ds[0]||"");
        if(from&&to&&to<from) to=(+to.slice(0,4)+100)+to.slice(4);   // two-digit years: a validity that ends before it starts is the next century
        items.push({g:qGroup(group), label:c[1].trim(), from, to, na:na&&!to}); continue }
      if(c.length===1 && /^[A-Z][A-Z /&-]{2,40}$/.test(c[0]) && !/VALID|SNO/i.test(c[0])) group=c[0].trim() } }

const Q_RENEW=[[/GROUND REFRESHER|^SEP$|CRM/,/AGTR|REFRESHER|\bSEP\b|CRM/],[/^DGR$/,/DGR/],[/AVSEC/,/AVSEC/],[/DRILL|DOOR/,/SFD|DRILL|DOOR|WET|SLIDE|SMOKE/],

  for(const ym of Object.keys(months)) for(const x of (months[ym].train||[])) if(x.date>=from) out.push({d:x.date, txt:String(x.type||"").toUpperCase()});
  return out.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0) }
function itemState(i, ahead, w){
  if(!i.to) return {...i, st:"none", d:null, txt:i.na?"N/A":"Not held"};
  const d=daysTo(i.to); if(d>365*40) return {...i, st:"ok", d, txt:"No expiry", forever:true};
  const st=qStatus(d,w.qa,w.qr), r=Q_RENEW.find(([a])=>a.test(i.label)), rn=st!=="ok"&&r?ahead.find(e=>r[1].test(e.txt)&&e.d<=i.to)||null:null;
  return {...i, st, d, rn, txt:d<0?"Expired":st==="ok"?"Valid":`${d} day${d===1?"":"s"}`} }

function qualsAlert(){ try{ const q=qualsData(), w=q.warn, ahead=trainingAhead(); let worst="";

  const b=document.createElement("button"); b.type="button"; b.id="isl"; b.setAttribute("aria-live","polite");
  b.innerHTML='<span class="ifx" aria-hidden="true"></span><span class="isw" aria-hidden="true"></span><span class="icp"></span><span class="ixp"></span>';
  document.body.appendChild(b); ISL.el=b;
  try{ if(matchMedia("(display-mode: standalone)").matches||navigator.standalone) document.documentElement.classList.add("isl-hw") }catch(e){}
  let y0=null, sw=false;
  b.addEventListener("pointerdown",e=>{ y0=e.clientY; sw=false });
  b.addEventListener("pointermove",e=>{ if(y0!=null && !sw && e.clientY-y0<-22){ sw=true; islDismiss() } });
  b.addEventListener("pointerup",()=>{ y0=null });
  b.addEventListener("click",e=>{ e.stopPropagation(); if(sw){ sw=false; return }
    const g=e.target.closest("[data-isltab]");
    const fl=e.target.closest("[data-islflight]")||(b.classList.contains("exp")&&ISL.cur&&ISL.cur.uid&&{dataset:{islflight:ISL.cur.uid}});
    if(fl){ islGoFlight(fl.dataset.islflight); return }
    if(g){ const want=g.dataset.isltab; islClose(); const t=document.querySelector(`.tabbar [data-tab="${want}"]`); if(t) t.click(); return }
    if(b.classList.contains("exp")) islClose(); else islOpen() });
  document.addEventListener("click",e=>{ if(ISL.el && ISL.el.classList.contains("exp") && !ISL.el.contains(e.target)) islClose() }, true);
  return b;
}
/* build 90: island motion from islandcn (github.com/opencoredev/islandcn, MIT): a spring per change, fitted there to recordings of the real
   island (response s, damping ratio); expand is livelier than the real one at my request. The size is animated in JS (Web Animations,
   sampled spring), the classes still set where it ends. Reduce Motion: no spring, the CSS fades only. */
const ISPR={appear:[.483,.62], expand:[.56,.58], collapse:[.479,.894], dismiss:[.432,1], swap:[.498,.829], split:[.505,.815], unsplit:[.487,.794]};
function springAt(resp,z,t){ const w=2*Math.PI/resp; if(z<1){ const wd=w*Math.sqrt(1-z*z); return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+z*w/wd*Math.sin(wd*t)) } return 1-Math.exp(-w*t)*(1+w*t) }
function islMorph(b, kind, apply){
  const r0=b.getBoundingClientRect(), c0=parseFloat(getComputedStyle(b).borderTopLeftRadius)||19;
  if(b._morph){ b._morph.cancel(); b._morph=null } apply();
  if(RM()||!b.animate||!r0.width) return;
  const r1=b.getBoundingClientRect(), c1=parseFloat(getComputedStyle(b).borderTopLeftRadius)||19;
  if(Math.abs(r1.width-r0.width)<1&&Math.abs(r1.height-r0.height)<1) return;
  const [resp,z]=ISPR[kind]||ISPR.swap, dur=Math.min(1.4, resp*(z<1?2.3:1.5)), N=48, fr=[];
  for(let i=0;i<=N;i++){ const k=i===N?1:springAt(resp,z,dur*i/N); fr.push({width:(r0.width+(r1.width-r0.width)*k)+"px", height:(r0.height+(r1.height-r0.height)*k)+"px", borderRadius:Math.max(8,c0+(c1-c0)*k)+"px"}) }
  b._morph=b.animate(fr,{duration:dur*1000, easing:"linear"}); b._morph.onfinish=()=>{ b._morph=null } }
function islRows(b){ [...b.querySelectorAll(".ixp > *")].forEach((e,i)=>e.style.setProperty("--i",i)) }
// the split: a short notice during the report countdown gets its own bubble beside the pill, and the countdown stays
function islSplit(n){ const b=islEl(); let bb=document.getElementById("islb");
  if(!bb){ bb=document.createElement("button"); bb.type="button"; bb.id="islb"; document.body.appendChild(bb);
    bb.addEventListener("click",e=>{ e.stopPropagation(); const m=ISL.split; islUnsplit(); if(m) islShow(m) }) }
  ISL.split=n; const tone=(n.cp.match(/class="il (i[a-z]+)"/)||[])[1]||"", ico=(n.cp.match(/<svg[\s\S]*?<\/svg>/)||[""])[0];
  bb.innerHTML=ico; bb.className="on "+tone+(b.classList.contains("exp")?" away":""); bb.setAttribute("aria-label",n.label+". Tap to open.");
  if(!b.classList.contains("split")) islMorph(b,"split",()=>b.classList.add("split"));
  clearTimeout(ISL.stimer); ISL.stimer=setTimeout(islUnsplit, Math.max(6000, n.life||6000)) }
function islUnsplit(){ const b=ISL.el, bb=document.getElementById("islb"); ISL.split=null; clearTimeout(ISL.stimer); if(bb) bb.className="";
  if(b&&b.classList.contains("split")) islMorph(b,"unsplit",()=>b.classList.remove("split")) }
// tapping the expanded countdown opens that flight's data card
function islGoFlight(uid){ let hit=null; for(const ym of Object.keys(months)) for(const s of ((months[ym]||{}).sectors||[])) if(cardKey(s)===uid) hit={ym,s};
  islClose(); if(!hit) return; cur=hit.ym; const t=document.querySelector('.tabbar [data-tab="log"]'); if(tab!=="log"&&t) t.click(); else render();
  setTimeout(()=>{ const row=document.querySelector(`#view .item[data-sheet="${hit.s.id}"]`); openCard(hit.s.id, row||ISL.el) }, 380) }
function islSparks(){
  if(RM()) return; const b=ISL.el, r=b.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(let i=0;i<16;i++){ const d=document.createElement("i"); d.className="isl-spark"; d.style.left=cx+"px"; d.style.top=cy+"px"; document.body.appendChild(d);
    const a=(Math.random()-.5)*Math.PI*1.4, dist=40+Math.random()*90, dx=Math.sin(a)*dist*1.6, dy=Math.cos(a)*dist*.8+10;
    const an=d.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.3)`,opacity:0}],
      {duration:900+Math.random()*500,delay:300,easing:"cubic-bezier(.2,.7,.3,1)",fill:"backwards"}); an.onfinish=()=>d.remove(); an.oncancel=()=>d.remove() }
}
function islShow(n){
  const b=islEl(); clearTimeout(ISL.timer); ISL.cur=n;
  const put=()=>{ if(ISL.cur!==n) return;
    b.querySelector(".icp").innerHTML=n.cp; b.querySelector(".ixp").innerHTML=n.xp||""; b.style.setProperty("--h",(n.h||170)+"px");
    const was=b.classList.contains("on"); islRows(b);
    islMorph(b, was?"swap":"appear", ()=>{ b.className="on "+(n.mini?"mini":"compact")+(n.glow?" g-"+n.glow:"")+(ISL.split&&n.kind==="report"?" split":"") }); b.querySelector(".ifx").className="ifx"+(n.fx?" "+n.fx:"");
    b.dataset.kind=n.kind; b.setAttribute("aria-label", n.label+(n.xp?". Tap for details.":""));
    if(n.kind==="pay") islSparks();
    if(n.life) ISL.timer=setTimeout(islNext, n.life) };
  if(b.classList.contains("on")){ islMorph(b,"collapse",()=>b.classList.remove("compact","mini","exp")); setTimeout(put, RM()?40:320) } else put();
}
function islHide(){ const b=ISL.el; ISL.cur=null; if(!b) return; clearTimeout(ISL.timer); islUnsplit(); islMorph(b,"dismiss",()=>{ b.className="" }); b.removeAttribute("data-kind"); b.setAttribute("aria-label","") }
function islNext(){ const n=ISL.q.shift(); if(n) return islShow(n); const p=islReport(); if(p) return islShow(p); islHide() }
function islPush(n, force){
  if(!n || (!force && !islOn(n.kind))) return;
  if(ISL.cur && ISL.cur.life){ ISL.q.push(n); return }   // a short one is showing: wait your turn
  if(ISL.cur && ISL.cur.kind==="report" && !force){ islSplit(n); return }   // build 90: during the countdown, the split
  islShow(n);
}
function islOpen(){ const b=ISL.el, n=ISL.cur; if(!b||!n||!n.xp) return; clearTimeout(ISL.timer); islRows(b); const bb=document.getElementById("islb"); if(bb) bb.classList.add("away");
  islMorph(b,"expand",()=>{ b.classList.remove("compact","mini"); b.classList.add("exp") }) }
function islClose(){ const b=ISL.el, n=ISL.cur; if(!b||!n||!b.classList.contains("exp")) return; const bb=document.getElementById("islb"); if(bb) bb.classList.remove("away");
  islMorph(b,"collapse",()=>{ b.classList.remove("exp"); b.classList.add(n.mini?"mini":"compact") }); if(n.life) ISL.timer=setTimeout(islNext, 4000) }
function islDismiss(){ const n=ISL.cur; if(!n) return; if(n.kind==="report"){ const m=islMem(); m.repOff=n.id; islSave(m) } islNext() }

// destination weather as a glow colour, and the effect inside the open card
function islGlow(w){ if(!w||!w.ok) return null; const k=w.kind; if(k==="rain"||k==="snow") return "rain"; if(k==="storm") return "storm"; if(k==="fog"||k==="cloud") return "haze"; return w.night?"night":"sun" }

/* ---- report countdown: from 3 h before report until off blocks of the first sector ---- */
function islReport(){
  if(!islOn("report")) return null;
  const now=Date.now(), D=(fdtlCache&&fdtlCache.duties)||[];
  for(const d of D){ const secs=d.secs||[]; if(!secs.length) continue; const X=d.hasActual?d.A:d.P, f=secs[0], off=f.offA??f.start;
    if(now>=off) continue;
    const rep=X&&X.report; if(rep==null || rep-now>3*HR) return null;
    const id="r"+off; if(islMem().repOff===id) return null;
    const before=now<rep, target=before?rep:off, left=Math.max(0,target-now)/MIN, land=f.onA??f.end;
    const w=wxInfo({stn:f.to, t:land, lands:land}), glow=islGlow(w);
    const rows=secs.map(x=>`<span class="iln"><span>${esc(x.from)} → ${esc(x.to)}</span><span>${hhmmZ(x.offA??x.start)}Z</span></span>`).join("");
    const wx=w&&w.ok?`<span class="iln"><span>${esc(f.to)} at landing</span><span>${Math.round(w.temp)}° ${esc(w.label)}</span></span>`:"";
    const what=before?"Report":"Off blocks";
    const frac=Math.max(0,Math.min(1,left/180)), ring=`<svg class="iring" viewBox="0 0 20 20" aria-hidden="true"><circle class="t" cx="10" cy="10" r="8"/><circle class="p" cx="10" cy="10" r="8" stroke-dasharray="50.27" stroke-dashoffset="${(50.27*(1-frac)).toFixed(2)}"/></svg>`;
    return {kind:"report", id, uid:f.uid, life:0, glow, fx:glow==="night"?"":glow,
      h:120+32*(secs.length+(wx?1:0)),
      cp:`<span class="il iblu">${ISL_ICO.plane}<span>${what} ${hhmmZ(target)}Z</span></span><span class="iv iblu">${ring}${hm(left)}</span>`,
      xp:`<span class="ih">${what} in ${hm(left)}</span><span class="isub">${before?`${hhmmZ(rep)}Z`:"Reported"} · ${secs.length} sector${secs.length===1?"":"s"}</span>${rows}${wx}<span class="igo" role="button" tabindex="0" data-islflight="${esc(f.uid)}">Open flight</span>`,
      label:`${what} at ${hhmmZ(target)} Z, ${hm(left)} to go` };
  }
  return null;
}

function islQualsN(x){

function islPayN(H, lvl, rate){

    label:`Pay milestone: past ${b} hours, every hour now pays ${inr(rate)}` };
}
function islRest(){
  const now=Date.now(), all=fdtlCache||fdtlAll(); let last=null;
  for(const d of all.duties){ const X=d.hasActual?d.A:d.P; if(X.signout<=now) last=d }
  if(!last) return null; const X=last.hasActual?last.A:last.P, n=X.next; if(!n || n.report<=now) return null;
  const a=X.signout, b=n.report; if(now-a>18*HR) return null;
  const pct=Math.max(0,Math.min(100,(now-a)/(b-a)*100)).toFixed(0);
  return {b, n:{kind:"rest", life:6500, h:156,
    cp:`<span class="il iok">${ISL_ICO.moon}<span>Legal for duty</span></span><span class="iv iok">${hhmmZ(b)}Z</span>`,
    xp:`<span class="ih">Legal for duty ${hhmmZ(b)}Z</span><span class="isub">Rest from ${hhmmZ(a)}Z · ${hm((b-now)/MIN)} to go</span><span class="iprog"><i style="width:${pct}%"></i></span><span class="igo" role="button" tabindex="0" data-isltab="duty">Open Duty</span>`,
    label:`Legal for duty at ${hhmmZ(b)} Z` }};
}
const islBackupN=()=>({kind:"backup", mini:true, life:2400, cp:`<span class="il iok">${ISL_ICO.tick}<span>Backup saved</span></span>`, label:"Backup saved"});

/* ---- what to show: run after every render and every 15 s ---- */
function islCheck(){
  if(!document.body) return;
  const m=islMem(); let ch=false;
  if(islOn("quals")) try{
    const q=qualsData(), w=q.warn, ahead=trainingAhead(), lv=m.q||{}, R={warn:1,bad:2}; let pick=null;
    for(const i of q.items){ const x=itemState(i,ahead,w); if(x.forever||!x.to) continue; const key=i.g+"|"+i.label, rank=R[x.st]||0, prev=lv[key]||0;
      if(rank>prev && (!pick||x.d<pick.d)) pick=x; if(rank!==prev){ lv[key]=rank; ch=true } }
    const r=recency();
    for(const [key,st,d,until,name] of [["rec90",r.s90,r.d90,r.u90,"Recency, 90 days"],["rec30",r.s30,r.d30,r.u30,"Recency, 30 days"]]){
      const rank=R[st]||0, prev=lv[key]||0; if(rank>prev && (!pick||d<pick.d)) pick={label:name, d, to:until, st, rec:true}; if(rank!==prev){ lv[key]=rank; ch=true } }
    m.q=lv; if(pick) islPush(islQualsN(pick));
  }catch(e){}
  if(islOn("pay")) try{
    const ym=ymNow(), k=calc(ym), H=k.totMin/60, lvl=[40,70,80,90].filter(b=>H>=b).length, p=m.p||{};
    if(p[ym]==null){ p[ym]=lvl; ch=true }                                   // first look at a month: no fanfare for hours already flown
    else if(lvl>p[ym]){ p[ym]=lvl; ch=true; if(k.r&&k.r[lvl]!=null) islPush(islPayN(H,lvl,k.r[lvl])) }
    else if(lvl<p[ym]){ p[ym]=lvl; ch=true }
    m.p=p;
  }catch(e){}
  if(islOn("rest")) try{ const R=islRest(); if(R && m.rest!==R.b){ m.rest=R.b; ch=true; if(!islReport()) islPush(R.n) } }catch(e){}   // the countdown already says it
  if(ch) islSave(m);
  if(!ISL.cur){ const p=islReport(); if(p) islShow(p) }
  else if(ISL.cur.kind==="report"){ const p=islReport(); if(!p) islNext(); else if(p.cp!==ISL.cur.cp||p.xp!==ISL.cur.xp||p.glow!==ISL.cur.glow) islRefresh(p) }
}

    ${d.dom.length?`<div class="tbl"><table class="stack"><thead><tr><th>Date</th><th>Station</th><th class="n">Nights</th><th class="n">Amount</th><th></th></tr></thead><tbody>${domRows}</tbody>

    <div class="btns"><button class="btn ${d.dom.length?"":"ghost"}" data-add="dom">Add domestic layover</button></div>

function slip(k){
  const L=(a,b,sm)=>`<div class="line"><span>${a}${sm?`<span class="sm">${sm}</span>`:""}</span><span class="v">${b}</span></div>`;
  let earn = k.fixedLines.map(([l,v])=>L(esc(l),inr(v))).join("");
  if(!k.hasFixed) earn += L("Fixed pay","–","Not entered yet");
  if(k.trainDays) earn += `<div class="line"><span>Hours this month<span class="sm">Flying ${hm(k.opMin)} + training ${hm(k.trainHrs*60)} (${k.trainDays} day${k.trainDays===1?"":"s"} × ${hm(k.trainPerDay*60)})</span></span><span class="v">${hm(k.totMin)}</span></div>`;
  earn += k.addLines.map(([lo,hi,h,rate])=>L(`Flying ${lo} to ${hi===Infinity?"+":hi} h`, inr(h*rate), `${hm(h*60)} × ${inr(rate)}`)).join("");
  if(!k.addLines.length) earn += L("Flying above 40 h", inr(0), `${hm(k.totMin)} payable${k.trainDays?" incl. training":""}, none above 40 h`);
  earn += L("SOD / deadhead", inr(k.sod), `${hm(k.dhMin)} × ${inr(k.sodRate)}`);
  earn += L("Domestic layover", inr(k.dom), `${k.domNights} × ${inr(k.domRate)}`);

  earn += `<div class="line tot"><span>Gross</span><span class="v">${inr(k.gross)}</span></div>`;
  let ded = L("Income tax (TDS)", inr(k.tds), `${profile.regime==="old"?"Old":"New"} regime, this month annualised`);
  ded += L("Employee PF", inr(k.pfEe), "12% of "+esc(compLabel("basic","Basic")));
  ded += L("Professional tax", inr(k.pt), "Maharashtra");
  ded += `<div class="line tot"><span>Deductions</span><span class="v">${inr(k.tds+k.pfEe+k.pt)}</span></div>`;
  return `<div class="slip"><div><h3>Earnings</h3>${earn}</div><div><h3>Deductions</h3>${ded}
    <p class="note" style="margin-top:12px">Employer PF and gratuity are part of CTC but are not paid out monthly, so they are left out of gross.</p></div>
    <div class="netbar"><span>Estimated take-home</span><b class="num">${inr(k.net)}</b>${k.intlUSD?`<span class="extra">Plus ${usd(k.intlUSD)} international layover allowance, tax-exempt and paid separately</span>`:""}</div></div>`;
}

function payslipCard(k){
  const p=(months[cur]&&months[cur].paid)||{}, g=+p.gross||0, n=+p.net||0;
  const fmt=v=>v?Number(v).toLocaleString("en-IN"):"";
  const paidIn=ymLabel(ymShift(cur,1)).split(" ")[0];
  const diffCell=(est,act)=>{ if(!act) return `<div class="v" style="color:var(--muted)">–</div>`; const dv=Math.round(act-est); const cls=dv===0?"":dv<0?"down":"up"; return `<div class="v ${cls}">${dv>0?"+":dv<0?"−":""}${inr(Math.abs(dv))}</div>` };
  // Judge gross and net separately; each gets its own tolerance (₹500 or 0.5%, whichever is larger)
  const judge=(est,act)=>{ if(!act) return null; const dv=act-est; return Math.abs(dv)<=Math.max(500,est*0.005)?{s:"ok",dv}:{s:dv<0?"low":"high",dv} };
  const G=judge(k.gross,g), N=judge(k.net,n), mon=esc(ymLabel(cur));
  const V=(cls,txt)=>`<div class="verdict ${cls}">${txt}</div>`;
  const abs=v=>inr(Math.abs(v));
  const checkPay=`Check the sectors, fixed block hours, SOD and layover nights logged for ${mon} against your payslip and roster.`;
  const checkDed=`Look at the deductions on the payslip: income tax (TDS) is the usual reason, as payroll spreads tax across the year differently from this estimate. Also check PF, professional tax and any other recovery.`;
  let verdict="";
  if(G&&N){
    if(G.s==="ok"&&N.s==="ok") verdict=V("ok","Gross and net both match the estimate.");
    else if(G.s==="low") verdict=V("bad",`Gross is ${abs(G.dv)} lower than the estimate${N.s!=="ok"?`, and net is ${abs(N.dv)} ${N.dv<0?"lower":"higher"}`:""}. ${checkPay}`);
    else if(G.s==="high") verdict=V("info",`Gross is ${abs(G.dv)} higher than the estimate${N.s!=="ok"?` and net is ${abs(N.dv)} ${N.dv<0?"lower":"higher"}`:""}. This may be arrears, a reimbursement or an allowance the app does not track.`);
    else if(N.s==="low") verdict=V("ok","Gross matches the estimate.")+V("warn",`Net is ${abs(N.dv)} lower than the estimate even though gross matches, so the difference is in deductions. ${checkDed}`);
    else verdict=V("ok","Gross matches the estimate.")+V("info",`Net is ${abs(N.dv)} higher than the estimate, so less was deducted than expected, most likely lower TDS this month.`);
  } else if(G){
    verdict = G.s==="ok"?V("ok","Gross matches the estimate. Add the net to check deductions too."):G.s==="low"?V("bad",`Gross is ${abs(G.dv)} lower than the estimate. ${checkPay}`):V("info",`Gross is ${abs(G.dv)} higher than the estimate. This may be arrears, a reimbursement or an allowance the app does not track.`);
  } else if(N){
    verdict = N.s==="ok"?V("ok","Net matches the estimate. Add the gross to confirm your flying pay."):V(N.s==="low"?"warn":"info",`Net is ${abs(N.dv)} ${N.s==="low"?"lower":"higher"} than the estimate. Add the gross from the payslip to see whether the difference is in pay or in deductions.`);
  }
  return `<section class="card">
    <h2>Payslip check</h2>
    <p class="sub">Usually on the ${esc(paidIn)} payslip. <button class="refbtn" type="button" data-ref="help|payslip" aria-label="Show more">🔽</button></p><p class="sub refx" data-refof="help|payslip">Enter what your payslip for ${esc(ymLabel(cur))} shows. Flying allowance for a month is normally paid with the next month's salary, so this is usually the ${esc(paidIn)} payslip.</p>
    <div class="grid2">
      <label class="f">Gross on payslip (₹)<input class="in n" id="paid-gross" data-paid="gross" value="${fmt(g)}" placeholder="0" inputmode="numeric"></label>
      <label class="f">Net paid (₹)<input class="in n" id="paid-net" data-paid="net" value="${fmt(n)}" placeholder="0" inputmode="numeric"></label>
    </div>
    ${g||n?`<div class="cmp">
      <div class="h"></div><div class="h v">Estimate</div><div class="h v">Payslip</div><div class="h v">Difference</div>
      <div>Gross</div><div class="v">${inr(k.gross)}</div><div class="v">${g?inr(g):"–"}</div>${diffCell(k.gross,g)}
      <div>Net</div><div class="v">${inr(k.net)}</div><div class="v">${n?inr(n):"–"}</div>${diffCell(k.net,n)}
    </div>${verdict}
    <p class="note">Gross off: pay. Net off: tax. <button class="refbtn" type="button" data-ref="help|diff" aria-label="Show more">🔽</button></p><p class="note refx" data-refof="help|diff">A gross difference points to pay: hours, sectors or allowances. A net difference with gross matching points to deductions, usually tax.</p>`:""}
  </section>`;
}
