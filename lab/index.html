function paidCell(x){
  if(x.k.rec) return `<span style="color:var(--muted)">–</span>`;
  const p=months[x.ym].paid; if(!p||!p.net) return `<span style="color:var(--muted)">–</span>`;
  const dv=p.net-x.k.net, cls=Math.abs(dv)<Math.max(500,x.k.net*0.005)?"":dv<0?"down":"up";
  return `<span class="${cls}">${inr(p.net)}</span>`;
}

function viewYear(){
  const [y,m]=cur.split("-").map(Number), fyStart = m>=4?y:y-1;
  const fy = yearMode==="fy";
  const yms = Array.from({length:12},(_,i)=>ymShift(fy?fyStart+"-04":y+"-01",i));
  const data = yms.map(ym=>{ const d=months[ym]; const has = !!d && (hasLog(d)||!!d.record); return {ym, has, k: has?summary(ym):null} });
  const logged = data.filter(x=>x.has);
  const sum=f=>logged.reduce((a,x)=>a+f(x.k),0);
  const max = Math.max(1,...logged.map(x=>x.k.net));
  const W=720,H=200,pl=8,pr=8,pt=16,pb=4,bw=(W-pl-pr)/12;
  const sc=v=>(H-pb)-(v/max)*(H-pb-pt);
  let bars="";
  data.forEach((x,i)=>{
    const xx=pl+i*bw;
    if(x.has){ const top=sc(x.k.net); bars+=`<rect role="button" data-ymbar="${x.ym}" class="bar${x.k.rec?" rec":""}" x="${xx+bw*.18}" y="${top}" width="${bw*.64}" height="${(H-pb)-top}" rx="2"><title>${ymLabel(x.ym)}: ${inr(x.k.net)}</title></rect>` }
    else bars+=`<rect x="${xx+bw*.18}" y="${H-pb-2}" width="${bw*.64}" height="2" fill="var(--border)"></rect>`;
  });
  const revIdx = -1;
  if(revIdx>0) bars+=`<line x1="${pl+revIdx*bw}" x2="${pl+revIdx*bw}" y1="${pt-6}" y2="${H-pb}" stroke="var(--muted)" stroke-dasharray="3 3"></line><text x="${pl+revIdx*bw+4}" y="${pt}">Revision</text>`;
  const rows = data.map(x=>`<tr><td><button class="mlink" data-month="${x.ym}" aria-label="Open ${ymLabel(x.ym)}">${ymShort(x.ym)}</button></td>${x.has?`<td class="n">${hm(x.k.opMin)}</td><td class="n">${hm(x.k.dhMin)}</td><td class="n">${x.k.domNights}</td><td class="n">${usd(x.k.intlUSD)}</td><td class="n">${inr(x.k.gross)}</td><td class="n">${x.k.tds==null?"–":inr(x.k.tds)}</td><td class="n">${inr(x.k.net)}</td><td class="n">${paidCell(x)}</td>`:`<td colspan="8" class="none">Nothing logged</td>`}</tr>`).join("");
  const anyRec = logged.some(x=>x.k.rec);
  const paidTotal = logged.reduce((a,x)=>a+(!x.k.rec&&months[x.ym].paid?(+months[x.ym].paid.net||0):0),0);
  return `<section class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <h2>${fy?`FY ${fyStart}-${String(fyStart+1).slice(2)}`:`Calendar year ${y}`}</h2>
      <div class="btns"><button class="btn ${fy?"quiet":""}" data-ymode="cal" style="padding:5px 12px">Calendar year</button><button class="btn ${fy?"":"quiet"}" data-ymode="fy" style="padding:5px 12px">Financial year</button></div>
    </div>
    <p class="sub">${logged.length} of 12 months logged. Bars show take-home${anyRec?"; lighter bars are months recorded in your Numbers dashboard":" (estimated)"}.</p>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Take-home by month">${bars}</svg><div class="xlab">${yms.map(ym=>`<span>${ymShort(ym)}</span>`).join("")}</div></div>
    <div class="tbl yr"><table><thead><tr><th>Month</th><th class="n">Block</th><th class="n">SOD</th><th class="n">Dom nts</th><th class="n">Intl USD</th><th class="n">Gross</th><th class="n">TDS</th><th class="n">Take-home</th><th class="n">Paid</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td>Total</td><td class="n">${hm(sum(k=>k.opMin))}</td><td class="n">${hm(sum(k=>k.dhMin))}</td><td class="n">${sum(k=>k.domNights)}</td><td class="n">${usd(sum(k=>k.intlUSD))}</td><td class="n">${inr(sum(k=>k.gross))}</td><td class="n">${anyRec?"–":inr(sum(k=>k.tds||0))}</td><td class="n">${inr(sum(k=>k.net))}</td><td class="n">${paidTotal?inr(paidTotal):"–"}</td></tr></tfoot></table></div>
    <p class="note">TDS is an estimate. <button class="refbtn" type="button" data-ref="help|tds" aria-label="Show more">🔽</button></p><p class="note refx" data-refof="help|tds">${anyRec?"Recorded months show the gross and net you entered in Numbers, so TDS is not shown for them. ":""}For logged months, TDS is that month's pay annualised, so it will not match payroll exactly when pay swings between months.</p>
  </section>`;
}

function pasteHistCard(){
  if(!rosterHist.length) return "";
  const t=ms=>new Date(ms+IST_OFF).toISOString().slice(0,16).replace("T"," ");
  const line=h=> h.historical ? `Older roster: ${h.filled||0} planned times${h.fixed?`, ${h.fixed} fixed blocks`:""}${h.offs?`, ${h.offs} days off`:""} restored`
    : [h.added?`${h.added} added`:"", h.updated?`${h.updated} updated`:"", h.removed?`${h.removed} removed`:"", h.changes?`${h.changes} duty change${h.changes===1?"":"s"}`:""].filter(Boolean).join(" · ") || "No changes";
  return `<section class="card">
    <h2>Paste history</h2>
    <p class="sub">Newest first, in IST. <button class="refbtn" type="button" data-ref="help|pastes" aria-label="Show more">🔽</button></p><p class="sub refx" data-refof="help|pastes">Each roster paste, newest first, in IST. Planned times are kept from the first paste that shows a flight before it operates, so pasting whenever your roster changes keeps them safe.</p>
    <div class="tbl"><table class="phist"><tbody>${rosterHist.slice(0,15).map(h=>`<tr><td class="n">${t(h.at)}</td><td>${esc(line(h))}</td></tr>`).join("")}</tbody></table></div>
  </section>`;
}
/* Fixed block lists: read from a fixed block PDF on this device with pdf.js (Mozilla's PDF reader, plain JavaScript
   that runs in Safari). It is fetched from this site only when you load a PDF, then kept for offline use. */
let fbPending=null, fbBusy="";
const fmtDay = d=>new Date(d+"T00:00:00Z").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"});
function loadScript(src){ return new Promise((ok,bad)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>bad(new Error("load")); document.head.appendChild(s) }) }
async function pdfText(buf){
  if(!window.pdfjsLib) await loadScript("../pdfjs/pdf.min.js");
  const lib=window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc="../pdfjs/pdf.worker.min.js";
  const doc=await lib.getDocument({data:buf}).promise; let out="";
  for(let i=1;i<=doc.numPages;i++){ const tc=await (await doc.getPage(i)).getTextContent();
    out+=tc.items.map(it=>it.str+(it.hasEOL?"\n":" ")).join("")+"\n" }
  return out;
}
// "ABC-XYZ 01:30:00": two station codes and a block time. Domestic is everything before Annexure B.
function parseFixedBlocks(text){
  const t=text.replace(/ /g," "), cut=t.search(/Annexure\s*B\s*:/i), startA=t.search(/Annexure\s*A\s*:/i);
  const grab=s=>{ const map={}, clash=[]; const re=/\b([A-Z]{3})\s*[-–]\s*([A-Z]{3})\b\s*(\d{1,2}):(\d{2})(?::(\d{2}))?/g; let m;
    while((m=re.exec(s))){ const k=m[1]+"-"+m[2], v=Math.round(((+m[3])*60+(+m[4])+(+m[5]||0)/60)*100)/100; if(!(v>0)) continue;   // a few blocks carry seconds; kept exactly
      if(map[k]!=null && map[k]!==v) clash.push(k); else map[k]=v }
    return {map, clash} };
  if(cut<0) return null;
  const dom=grab(t.slice(Math.max(0,startA),cut)), intl=grab(t.slice(cut));
  const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  let eff=""; const d=t.match(/ISSUE\s*DATE\s*:?\s*(\d{1,2})-([A-Za-z]{3})-(\d{2,4})/i);
  if(d&&MON[d[2].toLowerCase()]){ const y=d[3].length===2?"20"+d[3]:d[3]; eff=`${y}-${String(MON[d[2].toLowerCase()]).padStart(2,"0")}-${d[1].padStart(2,"0")}` }
  return {dom:dom.map, intl:intl.map, clash:[...dom.clash,...intl.clash], eff};
}
async function readFixedBlockPdf(file){
  fbBusy="Reading "+file.name+"…"; fbPending=null; render();
  try{
    const parsed=parseFixedBlocks(await pdfText(await file.arrayBuffer()));
    const n=parsed?Object.keys(parsed.dom).length+Object.keys(parsed.intl).length:0;
    fbBusy="";
    if(!parsed||!n){ showBanner("Could not find a fixed block table in that PDF. Nothing was saved."); render(); return }
    const t=new Date(), today=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-01";
    fbPending={...parsed, eff:parsed.eff||today, name:file.name.replace(/\.pdf$/i,"")};
  }catch(e){ fbBusy=""; showBanner(e&&e.message==="load"?"The PDF reader could not be fetched. Connect to the internet once and try again.":"Could not read that PDF. Nothing was saved.") }
  render();
}
function fbTable(map){ return `<div class="tbl"><table><thead><tr><th>Sector</th><th class="n">Block</th></tr></thead><tbody>${Object.keys(map).sort().map(k=>`<tr><td>${esc(k.replace("-"," → "))}</td><td class="n">${hm(map[k])}</td></tr>`).join("")}</tbody></table></div>` }
function fbCard(){
  const L=[...fbLists()].sort((a,b)=>b.eff.localeCompare(a.eff)), n=o=>Object.keys(o).length;
  const sample=o=>Object.keys(o).slice(0,4).map(k=>`${esc(k)} ${hm(o[k])}`).join(", ");
  const rows=L.map((l,i)=>{ const next=L[i-1];
    return `<tr><td>${esc(fmtDay(l.eff))}${next?` to ${esc(fmtDay(next.eff))}`:" onwards"}<span class="rtime">${esc(l.name||"Fixed block list")}</span></td><td class="n">${n(l.dom)}</td><td class="n">${n(l.intl)}</td>
      <td class="act"><button class="refbtn" type="button" data-ref="fb|${esc(l.id)}" aria-label="Show the list">🔽</button><button class="del" data-fbdel="${esc(l.id)}" aria-label="Delete list">×<span class="dl"> Remove</span></button></td></tr>` }).join("");
  const lists=L.map(l=>`<div class="refx fbprev" data-refof="fb|${esc(l.id)}"><b>${esc(fmtDay(l.eff))} list: domestic</b>${fbTable(l.dom)}<b>International</b>${fbTable(l.intl)}</div>`).join("");
  const P=fbPending;
  return `<section class="card">
    <h2>Fixed block lists</h2>
    <p class="sub">Load each fixed block PDF you receive. <button class="refbtn" type="button" data-ref="help|fb" aria-label="Show more">🔽</button></p>
    <p class="sub refx" data-refof="help|fb">The PDF is read on this phone and only the sector list is kept, here and in your backups. Each list applies from its start date until a later one takes over. The first load fetches the PDF reader from this site, so it needs internet once.</p>
    ${L.length?`<div class="tbl"><table><thead><tr><th>Applies</th><th class="n">Domestic</th><th class="n">Intl</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>${lists}`:""}
    ${P?`<div class="fbprev"><b>Found ${n(P.dom)} domestic and ${n(P.intl)} international sectors</b>
      <span class="rtime">Domestic: ${sample(P.dom)||"none"}. International: ${sample(P.intl)||"none"}.</span>
      ${P.clash.length?`<p class="note" style="color:var(--orange)">Listed twice with different times, first one kept: ${esc(P.clash.join(", "))}.</p>`:""}
      ${L.some(l=>l.eff===P.eff)?`<p class="note">A list already starts on this date; saving replaces it.</p>`:""}
      <label class="f" style="max-width:220px;margin-top:8px">Applies from<input class="in" type="date" id="fbEff" value="${esc(P.eff)}"></label>
      <div class="btns"><button class="btn" id="fbSave">Save list</button><button class="btn quiet" id="fbCancel">Cancel</button></div></div>`
    : `<div class="btns">${fbBusy?`<span class="muted">${esc(fbBusy)}</span>`:`<label class="btn${L.length?" quiet":""}" for="fbFile" style="display:inline-flex;align-items:center">Load fixed block PDF</label><input type="file" id="fbFile" accept=".pdf,application/pdf" hidden>`}</div>`}
  </section>`;
}

   Filled for you where the app already knows: date, flight, ICAO codes, ETD/ETA, report time, planned block, type.
   ATD and ATA are the sector's actual off and on block times: the same values the Duty tab uses for duty and FDP

   Informational record only: never a substitute for the OFP, load sheet or performance data. */
let cards = {};
const cardKey = s=>s.uid||("m|"+s.id);
const CY = [   // yes/no

const PHASES=[["pre","Pre-flight"],["dep","Departure"],["land","Arrival"],["post","Post-flight"]];
const CARD_FIELDS = CARD.flatMap(g=>g.rows.flat()).filter(f=>!f[3]||!f[3].calc);
// fields worth remembering per station: departure ones by the departure airport, arrival ones by the arrival airport
const MEM_DEP=["rwy","sid","eosid","ta"], MEM_ARR=["elev","lrwy","app","old","lda"];
let dcard=null;   // {s, key}
// build 89: the duty a sector belongs to, for the FDL on its card
function dutyOf(key){ const all=fdtlCache||fdtlAll(); for(const d of all.duties||[]) for(const x of (d.secs||[])) if(x.uid===key) return d; return null }
// FDL = latest FDP end (report + max FDP, UTC) and the max FDP, from the Duty tab: actual report if you have one, else planned;
// the limit already allows for landings, night duty, a standby cut and an extension
function fdlFor(key){ const d=dutyOf(key), x=d&&(d.A||d.P); if(!x||!x.lim||x.report==null) return ""; return `${hhmmMs(x.report+x.lim.fdp*MIN)} (${hm(x.lim.fdp)})` }
function secTimes(key){ const all=fdtlCache||fdtlAll(); for(const d of all.duties||[]) for(const x of (d.secs||[])) if((x.uid)===key) return {start:x.start, end:x.end, report:d.rep&&d.rep.plan}; return null }
const hhmmMs = t=>t==null?"":new Date(t).toISOString().slice(11,16);
function cardAuto(s, key){

    etd: tm?hhmmMs(tm.start):(depOf(s)||""), eta: tm?hhmmMs(tm.end):"", rep: tm&&tm.report?hhmmMs(tm.report):"",
    atd:a.off||"", ata:a.on||"", co:a.off||"", con:a.on||"", fdl:fdlFor(key), bp: +s.fixed?hm(+s.fixed).padStart(5,"0"):"", type:/MAX/i.test(profile.fleet||"")?"MAX":"", div:s.kind==="div"?"Y":"" };
}
// the most recent earlier card at the same airport, for suggestions
function cardMemory(key, dep, arr){
  const out={}; if(!dep&&!arr) return out;
  const list=Object.entries(cards).filter(([k,c])=>k!==key&&c).sort((a,b)=>(b[1].at||0)-(a[1].at||0));
  for(const f of MEM_DEP){ const hit=list.find(([k,c])=>c.dep===dep&&c[f]); if(hit) out[f]=hit[1][f] }
  for(const f of MEM_ARR){ const hit=list.find(([k,c])=>c.arr===arr&&c[f]); if(hit) out[f]=hit[1][f] }
  return out; }
function cardVal(key, f, auto){ const c=cards[key]||{}; return c[f]!=null&&c[f]!=="" ? c[f] : (auto[f]||"") }
const toMin = v=>{ const m=String(v||"").match(/^(\d{1,2}):(\d{2})$/); return m?(+m[1])*60+(+m[2]):null };
const spanHM = (a,b)=>{ const x=toMin(a), y=toMin(b); if(x==null||y==null) return ""; const d=((y-x)+1440)%1440; return String(Math.floor(d/60)).padStart(2,"0")+":"+String(d%60).padStart(2,"0") };
const CARD_PAIR={atd:"co", co:"atd", ata:"con", con:"ata"};
// build 88: counted like the section rings: fields the app fills in (date, flight, airports, ETD, ETA, planned block...) count as filled,
// and a field shown only after a Yes (defect details, diverted to, opti-climb speeds) counts only then. It used to count typed values only, so a full card stopped at 91%.
function cardProgress(s){ const key=cardKey(s); if(!cards[key]) return 0; const auto=cardAuto(s,key); let n=0, got=0;
  if(!auto.dep&&s.from) auto.dep=s.from; if(!auto.arr&&s.to) auto.arr=s.to;   // the airport table (ICAO codes) may not have loaded on the Flights list yet
  for(const g of CARD){ const F=secFields(g,key,auto); n+=F.length; got+=F.filter(f=>{ const v=cardVal(key,f[0],auto); return v!=null&&v!=="" }).length }
  return n?Math.round(got/n*100):0 }
function cardFieldHTML(f, key, auto, mem){
  const [id,label,type,x={}] = f, c=cards[key]||{};
  if(x.if && (c[x.if]||auto[x.if])!=="Y") return "";
  let v = x.calc==="block" ? spanHM(cardVal(key,"co",auto),cardVal(key,"con",auto)) : x.calc==="flight" ? spanHM(cardVal(key,"ab",auto),cardVal(key,"td",auto)) : cardVal(key,id,auto);
  const isAuto = !x.calc && (c[id]==null||c[id]==="") && auto[id];
  const sug = !v && mem[id] ? `<button type="button" class="dc-sug press" data-cardsug="${id}" data-v="${esc(mem[id])}">Last time ${esc(mem[id])}</button>` : "";
  const lab=`<span class="dc-l">${esc(label)}${x.utc?'<small>UTC</small>':""}</span>`;

  if(t.id==="rpdfNo"){ rpdf=null; render(); return }
  if(t.dataset&&t.dataset.rpdfmode&&rpdf){ rpdf.mode=t.dataset.rpdfmode; rpdfRun(); render(); return }
  if(t.id==="rosterGo"){ const ta=document.getElementById("rosterText"); if(ta&&ta.value.trim()) (window.PTMotion?PTMotion.wipe(t):Promise.resolve()).then(()=>reviewRoster(ta.value)); else if(window.PTMotion) PTMotion.shake(ta); return }
  if(t.id==="backupBtn"){ downloadBackup(); return }
  if(t.id==="fbCancel"){ fbPending=null; render(); return }
  if(t.id==="fbSave" && fbPending){ const e=(document.getElementById("fbEff")||{}).value||fbPending.eff;
    if(!/^\d{4}-\d\d-\d\d$/.test(e)){ showBanner("Choose the date this list applies from."); if(window.PTMotion) PTMotion.shake(document.getElementById("fbEff")); return }
    const keep=fbLists().filter(l=>l.eff!==e), lp=fbPending;
    profile.fbLists=[...keep, {id:uid(), eff:e, name:lp.name, dom:lp.dom, intl:lp.intl, loaded:new Date().toISOString()}];
    fbPending=null; queueProfile(); showBanner(`Fixed block list saved: ${Object.keys(lp.dom).length} domestic and ${Object.keys(lp.intl).length} international sectors from ${fmtDay(e)}.`); render(); return }
  if(t.dataset.fbdel){ const l=fbLists().find(x=>x.id===t.dataset.fbdel); if(!l) return;
    if(!confirm(`Delete the fixed block list starting ${fmtDay(l.eff)}? Sectors it covered go back to the planned block or an earlier list.`)) return;
    profile.fbLists=fbLists().filter(x=>x!==l); queueProfile(); render(); return }
  if(t.id==="prevM"){ cur=ymShift(cur,-1); viewChange(()=>render(),"back"); return }
  if(t.id==="nextM"){ cur=ymShift(cur,1); viewChange(()=>render(),"fwd"); return }
  const d=monthData(cur);
  if(t.dataset.add){
    const list=t.dataset.add, now=new Date(), today=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
    const date = cur===ymNow()?today:cur+"-01";
    let row={id:uid(), date};
    if(list==="sectors"){ const last=d.sectors[d.sectors.length-1];
      row = t.dataset.copy&&last ? {...last,id:uid(),example:false,from:last.to,to:last.from} : {...row,flt:"",from:last?last.to:(profile.base||""),to:"",kind:"op",fixed:0} }
    if(list==="dom") row.nights=1;
    if(list==="intl"){ row.country=""; row.mins=0 }
    if(list==="train"){ row.type=TRAIN_TYPES[1]; row.days=1 }
    d[list].push(row); queueMonth(cur); render();
    if(list==="sectors") openSheet({kind:"sector", id:row.id});
    else { const first = document.querySelector(`tr[data-id="${row.id}"] input:not([type=date])`); if(first) first.focus() }
    return;
  }
  if(t.dataset.del){ const inSheet=!!t.closest(".srow");
    if(inSheet) closeSheet(true);
    const id=t.closest("tr,.srow").dataset.id, gone=d[t.dataset.del].find(r=>r.id===id);
    if(gone && gone.roster) dismissed=[...dismissed, {key:t.dataset.del, uid:gone.uid||"", date:gone.date, from:gone.from||"", to:gone.to||"", stn:gone.stn||"", type:gone.type||"", label:[gone.date, gone.from&&gone.to?gone.from+"–"+gone.to:(gone.stn||gone.country||gone.type||"")].join(" ")}];
    const L=t.dataset.del, at=d[L].findIndex(r=>r.id===id), dis=dismissed.length, ym=cur;
    const finish=()=>{ d[L]=d[L].filter(r=>r.id!==id); queueMonth(cur); render();
      if(gone) showUndo(`${L==="sectors"?"Sector":L==="dom"?"Layover":L==="train"?"Training":"Layover"} removed`, ()=>{ const m=monthData(ym); m[L].splice(Math.max(0,at),0,gone); dismissed=dismissed.slice(0,dis); queueMonth(ym); render() }) };
    const rowEl=document.querySelector(`#view [data-sheet="${id}"]`)||t.closest("tr");
    if(window.PTMotion && PTMotion.ready() && rowEl && !inSheet) PTMotion.fold(rowEl, finish); else if(window.PTMotion && PTMotion.ready() && inSheet){ const el2=document.querySelector(`#view [data-sheet="${id}"]`); if(el2) PTMotion.fold(el2, finish); else finish() } else finish();
    return }
  if(t.id==="undismiss"){ dismissed=[]; queueSave(); showBanner("Deleted roster rows will come back on your next paste."); render(); return }
  if(t.id==="clearEx"){ d.sectors=d.sectors.filter(s=>!s.example); d.dom=d.dom.filter(s=>!s.example); queueMonth(cur); render(); return }
  if(t.id==="loadEx"){
    const D=n=>cur+"-"+String(n).padStart(2,"0"), b=profile.base||"BOM";
    d.sectors.push(
      {id:uid(),date:D(3),flt:"XY1237",from:b,to:"IXR",kind:"op",fixed:155,example:true},
      {id:uid(),date:D(4),flt:"XY1238",from:"IXR",to:b,kind:"op",fixed:150,example:true},
      {id:uid(),date:D(9),flt:"XY1101",from:b,to:"HYD",kind:"dh",fixed:85,example:true},
      {id:uid(),date:D(9),flt:"XY1102",from:"HYD",to:"BLR",kind:"op",fixed:80,example:true});
    d.dom.push({id:uid(),date:D(3),stn:"IXR",nights:1,example:true});
    queueMonth(cur); render(); return;
  }
});
document.addEventListener("change", e=>{
  const el=e.target;
  if(qualsChange(el)) return;
  if(islChange(el)) return;
  if(el.id==="rosterFile"){ const f=el.files&&el.files[0]; if(f){ const r=new FileReader(); r.onload=()=>reviewRoster(r.result); r.readAsText(f) } el.value=""; return }
  if(el.id==="rosterText") return;
  if(el.id==="rosterPdf"){ const f=el.files&&el.files[0]; el.value=""; if(f) readRosterPdf(f); return }
  if(el.id==="fbFile"){ const f=el.files&&el.files[0]; el.value=""; if(f) readFixedBlockPdf(f); return }
  if(el.id==="fbEff"){ if(fbPending&&el.value) fbPending.eff=el.value; return }
  if(el.id==="restoreFile"){ if(el.files&&el.files[0]) restoreBackup(el.files[0]); el.value=""; return }
  if(el.dataset.p){ let v=el.value;
    if(el.dataset.num) v=parseFloat(String(v).replace(/,/g,""))||0;
    if(el.dataset.p==="layoverExempt") v=v==="1";
    if(el.dataset.fleet){ if(!(v>0)) v=40; profile.fleetAvgSet = true }
    profile[el.dataset.p]=v; queueProfile(); render(); return }
  if(el.id==="dutyJump"){ if(el.value){ dutyDay=el.value; render() } return }
  if(el.dataset.call!=null){ const k=el.dataset.call, c2={...(actuals[k]||{})};
    if(el.value==="yes") c2.called=true; else if(el.value==="no") c2.called=false; else delete c2.called;
    if(Object.keys(c2).length) actuals[k]=c2; else delete actuals[k];
    queueSave(); render(); return }
  if(el.dataset.flag!=null){ const k=el.dataset.uid, c2={...(actuals[k]||{})};
    if(el.checked) c2[el.dataset.flag]=true; else delete c2[el.dataset.flag];
    if(Object.keys(c2).length) actuals[k]=c2; else delete actuals[k];
    queueSave(); render(); return }
  if(el.dataset.sby!=null){ const k=el.dataset.sby, c2={...(actuals[k]||{})};
    if(el.value==="airport") c2.sby="airport"; else delete c2.sby;
    if(Object.keys(c2).length) actuals[k]=c2; else delete actuals[k];
    queueSave(); render(); return }
  if(el.dataset.act!=null){ const v=normHHMM(el.value);
    if(v===null){ showBanner("Enter times in UTC as 14:35 or 1435."); el.value=""; return }
    const key=el.dataset.act, f=el.dataset.af; const cur2={...(actuals[key]||{})};
    if(v) cur2[f]=v; else delete cur2[f];
    if(Object.keys(cur2).length) actuals[key]=cur2; else delete actuals[key];
    queueSave(); render(); return }
  if(el.dataset.paid){ const d=monthData(cur); const v=parseFloat(String(el.value).replace(/[^\d.]/g,""))||0;
    d.paid={...(d.paid||{}),[el.dataset.paid]:v}; if(!d.paid.gross&&!d.paid.net) delete d.paid; queueMonth(cur); render(); return }
  if(el.dataset.cn){ const v=el.value.trim(), n={...(profile.compNames||{})}; if(v && v!==el.dataset.def) n[el.dataset.cn]=v; else delete n[el.dataset.cn]; profile.compNames=n; queueProfile(); render(); return }
  if(el.dataset.ex){ const x=(profile.extra||[]).find(y=>y.id===el.dataset.ex); if(!x) return;
    const f=el.dataset.ef; if(f==="name") x.name=el.value.trim(); else if(f==="cash") x.cash=el.value==="1"; else x.amt=parseFloat(String(el.value).replace(/[^\d.]/g,""))||0;
    queueProfile(); render(); return }
  if(el.dataset.fx){ profile.fixed[el.dataset.fx][el.dataset.k]=parseFloat(String(el.value).replace(/[^\d.]/g,""))||0; queueProfile(); render(); return }
  const tr=el.closest("tr,.srow"); if(!tr||!el.dataset.f) return;
  const list = el.id[0]==="s"?"sectors":el.id[0]==="d"?"dom":el.id[0]==="t"?"train":"intl";
  const row = monthData(cur)[list].find(r=>r.id===tr.dataset.id); if(!row) return;
  let v=el.value;
  // Pay-only fields: your actual block and the airspace tick survive roster pastes without marking the row edited
  if(el.dataset.f==="airspace"||el.dataset.f==="act"){ if(el.type==="checkbox") { if(el.checked) row.airspace=true; else delete row.airspace }
    else { const m=parseHM(v); if(m>0) row.act=m; else delete row.act }
    queueMonth(cur); render(); return }
  if(el.dataset.tm){ const t=normHHMM(v); if(t===null){ showBanner("Enter times in UTC as 14:35 or 1435."); el.value=row[el.dataset.f]||""; return } v=t }
  else if(el.dataset.hm) v=parseHM(v); else if(el.dataset.num) v=parseFloat(v)||0; else if(el.classList.contains("caps")) v=v.toUpperCase().trim();
  row[el.dataset.f]=v; if(row.example) row.example=false; if(row.roster) row.edited=true;
  // a sector dated in another month moves there
  if(el.dataset.f==="date" && v && v.slice(0,7)!==cur){ const tgt=v.slice(0,7); monthData(cur)[list]=monthData(cur)[list].filter(r=>r!==row); monthData(tgt)[list].push(row); queueMonth(tgt) }
  queueMonth(cur); render();
});
document.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.matches("input.in")){ e.target.blur(); } });
document.addEventListener("keydown", e=>{ if((e.key==="Enter"||e.key===" ") && e.target.matches('[role=button],[role=tab]')){ e.preventDefault(); e.target.click() } });

try{ const t=localStorage.getItem(LS_KEY+".tab"); if(t && ["month","log","duty","intl","pay","year","setup","more","quals"].includes(t)) tab = t==="intl" ? "log" : t }catch(e){}
initStore();
// lab-only offline worker (scope /lab/), so the lab and its briefing map open with no signal; the live app keeps its own
if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="127.0.0.1")){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(()=>{});
    // keep the lab's saved files, downloaded maps and briefings even when the phone is short of space
    try{ navigator.storage && navigator.storage.persist && navigator.storage.persist() }catch(e){} });
}
})();
